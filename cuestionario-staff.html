<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>2 Verdades y 1 Mentira · Cuerpo Técnico · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Chivo:wght@400;500;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#CC3334;--r2:rgba(204,51,52,.09);
  --bg:#f4f2ee;--surface:#fbfaf8;--surface-2:#f0ede8;
  --ink:#14110f;--ink-2:#45413b;--ink-3:#797269;--line:#e2ddd5;
}
html,body{min-height:100%;font-family:'Chivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
button{font-family:inherit;cursor:pointer;border:none;}
input{font-family:inherit;outline:none;}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px;}
.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:8px;}
.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:.9;}
.brand span{color:var(--r);}
.sub{font-family:'Chivo Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;}
.rule{height:2px;background:var(--r);margin:16px 0 20px;}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.search{flex:1;min-width:180px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 13px;font-size:13.5px;}
.count{font-family:'Chivo Mono',monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
.count b{color:var(--ink);}
.missing{font-size:11.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.6;}
.missing b{color:var(--r);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;}
.nombre{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px;font-weight:700;margin-bottom:10px;}
.af{font-size:13.5px;color:var(--ink-2);padding:8px 10px;border-radius:7px;background:var(--surface-2);margin-bottom:7px;line-height:1.4;}
.af.lie{background:var(--surface-2);position:relative;}
.af.lie.revelada{background:var(--r2);border:1px solid rgba(204,51,52,.25);color:var(--ink);}
.toggle{width:100%;margin-top:6px;background:transparent;border:1.5px solid var(--line);border-radius:7px;padding:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:'Chivo Mono',monospace;}
.toggle:hover{border-color:var(--r);color:var(--r);}
.fecha{font-family:'Chivo Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:10px;}
.empty{text-align:center;padding:50px 20px;color:var(--ink-3);font-size:13px;}
.warn{background:rgba(204,51,52,.08);border:1px solid rgba(204,51,52,.2);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ink-2);line-height:1.5;margin-bottom:20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">RACING <span>LAB</span></div>
      <div class="sub">2 verdades y 1 mentira · cuerpo técnico</div>
    </div>
  </div>
  <div class="rule"></div>

  <div class="warn">Esta página no pide contraseña: cualquiera con el enlace puede verla. No la compartas fuera del cuerpo técnico.</div>

  <div class="bar">
    <input class="search" id="buscar" placeholder="Buscar jugador…" oninput="render()"/>
    <div class="count" id="contador"></div>
  </div>
  <div class="missing" id="faltan"></div>

  <div id="grid" class="grid"></div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const CONFIG = {
  apiKey:"AIzaSyBNDylPVfge6SFXVfJAcna9v7qh_CffI7Y",
  authDomain:"racing-portuense-scouting.firebaseapp.com",
  projectId:"racing-portuense-scouting",
  storageBucket:"racing-portuense-scouting.firebasestorage.app",
  messagingSenderId:"1073919975511",
  appId:"1:1073919975511:web:7c7f59495d1f67f6f44312"
};
const app = getApps().length ? getApps()[0] : initializeApp(CONFIG);
const db = getFirestore(app);

/* Misma plantilla que en cuestionario.html, para poder avisar de quién
   falta por responder. Si cambia la plantilla, actualiza las dos listas. */
const JUGADORES = [
  'Adri Cuevas','Adri Rodríguez','Amengual','Brandon','Carmelo','Farrando',
  'Fuentes','Héctor Peña','Hugo Rodríguez','Jacobo','Javi Tamayo',
  'Jesús Castaño','Josema','Juanma','Lainez','Lolo Garrido','Luca',
  'Luis Ortega','Lupu','Marcos','Marcos Talavera','Rodri',
  'Rodrigo Sanz','Rubén Sánchez','Víctor Olmo'
];

let RESPUESTAS = [];
const reveladas = new Set();

async function cargar(){
  document.getElementById('grid').innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const snap = await getDocs(collection(db,'dosVerdadesMentira'));
    RESPUESTAS = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
    render();
  }catch(e){
    console.error(e);
    document.getElementById('grid').innerHTML = '<div class="empty">No se pudo cargar. Revisa la conexión y recarga la página.</div>';
  }
}

function fmtFecha(ts){
  if(!ts?.toDate) return '';
  const d = ts.toDate();
  return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

window.toggleReveal = function(id){
  if(reveladas.has(id)) reveladas.delete(id); else reveladas.add(id);
  render();
};

window.render = function(){
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  const filtradas = RESPUESTAS.filter(r=>(r.nombre||'').toLowerCase().includes(q));

  document.getElementById('contador').innerHTML =
    `<b>${RESPUESTAS.length}</b> de <b>${JUGADORES.length}</b> han respondido`;

  const respondieron = new Set(RESPUESTAS.map(r=>r.nombre));
  const faltan = JUGADORES.filter(n=>!respondieron.has(n));
  document.getElementById('faltan').innerHTML = faltan.length
    ? `Faltan: <b>${faltan.join(', ')}</b>`
    : 'Ha respondido todo el equipo.';

  if(!filtradas.length){
    document.getElementById('grid').innerHTML = '<div class="empty">Sin respuestas todavía — comparte el QR con el equipo.</div>';
    return;
  }

  document.getElementById('grid').innerHTML = filtradas.map(r=>{
    const af = r.afirmaciones || [];
    const rev = reveladas.has(r.id);
    return `<div class="card">
      <div class="nombre">${r.nombre||'—'}</div>
      ${af.map(a=>`<div class="af ${a.esMentira?'lie'+(rev?' revelada':''):''}">${rev && a.esMentira?'🤥 ':''}${a.texto}</div>`).join('')}
      <button class="toggle" onclick="toggleReveal('${r.id}')">${rev?'Ocultar mentira':'Revelar mentira'}</button>
      <div class="fecha">${fmtFecha(r.actualizadoEn)}</div>
    </div>`;
  }).join('');
};

cargar();
</script>
</body>
</html>
