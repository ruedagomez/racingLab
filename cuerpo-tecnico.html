<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cuerpo Técnico · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#e8192c;--r2:rgba(232,25,44,.09);--r3:rgba(232,25,44,.2);
  --blk:#0b0b0b;--txt:#111;--mid:#6b6b6b;--faint:#b0b0b0;
  --bdr:#e2e2e2;--bg:#f3f3f1;--wh:#fff;
  --fit:#15803d;--fit-bg:#f0fdf4;
  --warn:#c2410c;--warn-bg:#fff7ed;
}
html,body{min-height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── NAV ── */
.nav{height:62px;background:var(--wh);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.nav-left{display:flex;align-items:center;gap:14px;}
.back{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mid);text-transform:uppercase;padding:6px 12px;border:1.5px solid var(--bdr);border-radius:4px;transition:all .2s;cursor:pointer;background:none;}
.back:hover{border-color:var(--r);color:var(--r);}
.back svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ndiv{width:1px;height:22px;background:var(--bdr);}
.nb{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--txt);letter-spacing:.5px;line-height:1;}
.nb span{color:var(--r);}
.nav-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--wh);text-transform:uppercase;background:var(--r);padding:3px 10px;border-radius:2px;}

/* ── HERO ── */
.hero{background:var(--blk);padding:52px 40px 48px;position:relative;overflow:hidden;}
.hero::before{content:'STAFF';position:absolute;right:-8px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:240px;color:rgba(255,255,255,.02);pointer-events:none;white-space:nowrap;letter-spacing:6px;}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.038) 1px,transparent 1px);background-size:26px 26px;}
.hi{max-width:1280px;margin:0 auto;position:relative;z-index:1;}
.he{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.28em;color:var(--r);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;animation:fadeUp .5s ease .05s both;}
.he::before{content:'';display:inline-block;width:22px;height:1.5px;background:var(--r);}
.ht{font-family:'Bebas Neue',sans-serif;font-size:76px;color:var(--wh);letter-spacing:.5px;line-height:.88;animation:fadeUp .5s ease .1s both;}
.hero-sub{margin-top:16px;font-size:13px;font-weight:300;color:rgba(255,255,255,.35);letter-spacing:.04em;animation:fadeUp .5s ease .18s both;}

/* ── WRAP ── */
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;}

/* ── SECTION HEADER ── */
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:40px 0 24px;border-bottom:1px solid var(--bdr);margin-bottom:32px;flex-wrap:wrap;gap:8px;}
.st{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.12em;color:var(--txt);text-transform:uppercase;}
.sc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);}

/* ── STAFF GRID ── */
.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:60px;}

/* ── STAFF CARD ── */
.staff-card{background:var(--wh);border:1px solid var(--bdr);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;position:relative;}
.staff-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.1);}
.staff-card.tbd{opacity:.45;cursor:default;}
.staff-card.tbd:hover{transform:none;box-shadow:none;}
.card-photo{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--bg);position:relative;}
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .4s ease;}
.staff-card:hover .card-photo img{transform:scale(1.03);}
.card-photo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);}
.card-photo-initials{font-family:'Bebas Neue',sans-serif;font-size:52px;color:rgba(255,255,255,.15);letter-spacing:2px;}
.card-accent{height:3px;background:var(--r);}
.card-body{padding:16px 16px 18px;}
.card-role{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--r);margin-bottom:5px;}
.card-name{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--txt);letter-spacing:.5px;line-height:1;margin-bottom:10px;}
.card-status{display:inline-flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;}
.status-available{background:var(--fit-bg);color:var(--fit);}
.status-available::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--fit);animation:pulse 2s infinite;}
.status-tbd{background:#f5f5f5;color:var(--faint);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card-footer{padding:10px 16px 14px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.card-footer-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);}
.card-arrow{font-size:14px;color:var(--faint);transition:color .2s,transform .2s;}
.staff-card:hover .card-arrow{color:var(--r);transform:translateX(3px);}

/* ── PROFILE (full page) ── */
.profile-wrap{display:none;}
.profile-wrap.active{display:block;animation:fadeIn .3s ease;}

/* Profile hero */
/* Sticky back bar */
.ph-topbar{
  height:52px;background:rgba(11,11,11,.96);border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;padding:0 40px;position:sticky;top:62px;z-index:20;
  backdrop-filter:blur(10px);
}
.ph-back{display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);cursor:pointer;background:none;border:none;padding:0;transition:color .2s;}
.ph-back:hover{color:var(--r);}
.ph-back svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ph-topbar-name{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);}

/* Hero body */
.ph{background:var(--blk);position:relative;overflow:hidden;}
.ph::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:26px 26px;}
.ph-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:44px;padding:44px 40px;position:relative;z-index:1;}

/* Photo frame — contained card with shadow */
.ph-photo-frame{
  flex-shrink:0;width:200px;
  border-radius:6px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  position:relative;
}
.ph-photo-frame img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top center;display:block;}
.ph-photo-frame .ph-photo-ph{width:200px;aspect-ratio:3/4;background:linear-gradient(135deg,#1c1c1c,#2a2a2a);display:flex;align-items:center;justify-content:center;}
.ph-photo-ph-i{font-family:'Bebas Neue',sans-serif;font-size:64px;color:rgba(255,255,255,.1);letter-spacing:2px;}
/* Red accent line on photo */
.ph-photo-frame::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--r);}

/* Info */
.ph-info{flex:1;}
.ph-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.28em;color:var(--r);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ph-eyebrow::before{content:'';display:inline-block;width:18px;height:1.5px;background:var(--r);}
.ph-name{font-family:'Bebas Neue',sans-serif;font-size:64px;color:var(--wh);letter-spacing:.5px;line-height:.88;margin-bottom:20px;}
.ph-meta{display:flex;gap:0;flex-wrap:wrap;margin-bottom:22px;border-left:1px solid rgba(255,255,255,.08);}
.ph-m{padding:0 24px;border-right:1px solid rgba(255,255,255,.08);}
.ph-m-v{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.04em;}
.ph-m-l{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:3px;}
.ph-quote{font-size:13px;font-weight:300;color:rgba(255,255,255,.32);line-height:1.7;font-style:italic;max-width:480px;padding-left:16px;border-left:2px solid var(--r);}

/* Profile tabs */
.ptabs{display:flex;border-bottom:2px solid var(--bdr);position:sticky;top:114px;background:var(--bg);z-index:10;}
.ptab{padding:12px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;background:none;border-top:none;border-left:none;border-right:none;}
.ptab:hover{color:var(--txt);}
.ptab.active{color:var(--r);border-bottom-color:var(--r);}
.tab-content{display:none;padding:36px 0 56px;animation:fadeIn .25s ease;}
.tab-content.active{display:block;}

/* Responsabilidades */
.resp-section{margin-bottom:32px;}
.resp-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--bdr);}
.resp-icon{font-size:18px;}
.resp-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--txt);}
.resp-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.resp-col{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;overflow:hidden;border-top:3px solid var(--bdr);}
.resp-col.before{border-top-color:#2563eb;}
.resp-col.during{border-top-color:var(--r);}
.resp-col.after{border-top-color:var(--fit);}
.resp-col-head{padding:12px 16px;display:flex;align-items:center;gap:8px;}
.resp-col-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);}
.resp-col-icon{font-size:13px;}
.resp-items{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;}
.resp-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--txt);line-height:1.5;}
.resp-item::before{content:'✓';color:var(--r);font-weight:700;flex-shrink:0;font-size:11px;margin-top:1px;}
.resp-item.wip{color:var(--faint);font-style:italic;}
.resp-item.wip::before{content:'○';color:var(--faint);}

/* Weekly status */
.status-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px;}
.status-day{background:var(--wh);border:1px solid var(--bdr);border-radius:4px;padding:10px 8px;text-align:center;}
.sd-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
.sd-status{width:10px;height:10px;border-radius:50%;background:var(--fit);margin:0 auto;}
.sd-status.off{background:var(--faint);}
.sd-status.match{background:var(--r);}

/* Objectives */
.obj-card{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:18px;margin-bottom:12px;border-left:3px solid transparent;transition:border-color .2s;}
.obj-card:hover{border-left-color:var(--r);}
.obj-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:6px;}
.obj-desc{font-size:12px;color:var(--mid);line-height:1.6;}
.obj-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.obj-progress{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-right:12px;}
.obj-fill{height:100%;background:var(--r);border-radius:2px;}
.obj-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);}

/* Ficha */
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.ficha-card{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:20px;}
.ficha-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:14px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(226,226,226,.6);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-lbl{color:var(--mid);}
.stat-val{font-weight:600;color:var(--txt);}
.stat-val.wip{color:var(--faint);font-style:italic;font-weight:400;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;cursor:pointer;border:none;}
.btn-primary{background:var(--r);color:var(--wh);}
.btn-primary:hover{background:#c8151f;}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mid);}
.btn-ghost:hover{border-color:var(--r);color:var(--r);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* Footer */
.ft{border-top:1px solid var(--bdr);padding:24px 40px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;}
.ft-b{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--faint);letter-spacing:1px;}
.ft-b span{color:var(--r);}

@media(max-width:1100px){.staff-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.staff-grid{grid-template-columns:repeat(2,1fr);}.resp-cols{grid-template-columns:1fr;}.ph-photo-frame{width:140px;}.ph-name{font-size:44px;}.ficha-grid{grid-template-columns:1fr;}.nav{padding:0 20px;}.wrap{padding:0 20px;}.hero{padding:40px 20px;}.ht{font-size:56px;}.status-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:500px){.staff-grid{grid-template-columns:1fr;}.ph-inner{flex-direction:column;}.ph-photo{width:100%;aspect-ratio:4/3;}.ph-photo::after{display:none;}}
</style>
</head>

<nav class="nav">
  <div class="nav-left">
    <button class="back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver
    </button>
    <div class="ndiv"></div>

</nav>

<!-- MAIN VIEW -->
<div id="main-view">
  <section class="hero">
    <div class="hi">
      <div class="he">Racing Club Portuense · Temporada 2026/27</div>
      <div class="ht">CUERPO<br/>TÉCNICO</div>

<!-- PROFILE VIEW -->
<div id="profile-view" class="profile-wrap">

      </div>
    </div>
  </div>

  <div class="ptabs">
    <button class="ptab active" onclick="switchTab('t-resp',this)">Responsabilidades</button>
    <button class="ptab" onclick="switchTab('t-objectives',this)">Objetivos</button>
    <button class="ptab" onclick="switchTab('t-ficha',this)">Ficha Personal</button>
  </div>

  <div class="wrap">
    <div id="t-resp" class="tab-content active"></div>
    <div id="t-objectives" class="tab-content"></div>
    <div id="t-ficha" class="tab-content"></div>
  </div>
</div>

/* ── RENDER GRID ── */
function renderGrid() {
  const grid = document.getElementById('staff-grid');
  grid.innerHTML = '';
  STAFF.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'staff-card' + (s.tbd ? ' tbd' : '');
    div.style.animation = `cardIn .35s ease ${i*.06}s both`;

    const photoHtml = s.photo
      ? `<img src="${s.photo}" alt="${s.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-photo-placeholder\\'><div class=\\'card-photo-initials\\'>${initials(s.name)}</div></div>'">`
      : `<div class="card-photo-placeholder"><div class="card-photo-initials">${initials(s.name)}</div></div>`;

    div.innerHTML = `
      <div class="card-photo">${photoHtml}</div>
      <div class="card-accent"></div>
      <div class="card-body">
        <div class="card-role">${s.role}</div>
        <div class="card-name">${s.tbd ? s.role : s.name}</div>
        <span class="card-status ${s.tbd?'status-tbd':'status-available'}">${s.tbd?'Por confirmar':'Disponible'}</span>
      </div>
      <div class="card-footer">
        <div class="card-footer-lbl">${s.tbd?'Pendiente de incorporación':'Ver ficha completa'}</div>
        ${!s.tbd?'<div class="card-arrow">→</div>':''}
      </div>`;

    if (!s.tbd) div.onclick = () => openProfile(s.id);
    grid.appendChild(div);
  });
}

function initials(name) {
  const p = name.trim().split(/\s+/);
  return p.length>=2 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

/* ── PROFILE ── */
let currentStaff = null;

function openProfile(id) {
  currentStaff = STAFF.find(s=>s.id===id);
  if(!currentStaff) return;

  document.getElementById('main-view').style.display='none';
  document.getElementById('profile-view').classList.add('active');
  window.scrollTo(0,0);

  // Hero
  const photoWrap = document.getElementById('ph-photo-wrap');
  if(currentStaff.photo) {
    photoWrap.innerHTML = `<img src="${currentStaff.photo}" alt="${currentStaff.name}"
      onerror="this.parentElement.innerHTML='<div class=\\'ph-photo-ph\\'><div class=\\'ph-photo-ph-i\\'>${initials(currentStaff.name)}</div></div>'">`; 
  } else {
    photoWrap.innerHTML = `<div class="ph-photo-ph"><div class="ph-photo-ph-i">${initials(currentStaff.name)}</div></div>`;
  }

  document.getElementById('ph-topbar-name').textContent = currentStaff.role.toUpperCase() + ' · ' + currentStaff.name.toUpperCase();
  document.getElementById('ph-eyebrow').textContent = currentStaff.role + ' · Racing Club Portuense';
  document.getElementById('ph-name').textContent = currentStaff.name.toUpperCase();
  document.getElementById('ph-meta').innerHTML = [
    {l:'Temporada',v:'2026/27'},
    {l:'Club',v:'Racing C. Portuense'},
    currentStaff.ficha.licencia ? {l:'Licencia',v:currentStaff.ficha.licencia} : null,
  ].filter(Boolean).map(m=>`<div class="ph-m"><div class="ph-m-v">${m.v}</div><div class="ph-m-l">${m.l}</div></div>`).join('');
  document.getElementById('ph-quote').textContent = currentStaff.quote || '';
  document.getElementById('ph-quote').style.display = currentStaff.quote ? '' : 'none';

  // Reset tabs
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector('.ptab').classList.add('active');
  document.getElementById('t-resp').classList.add('active');

  renderRespTab(currentStaff);
  renderObjectivesTab(currentStaff);
  renderFichaTab(currentStaff);
}

window.closeProfile = function() {
  document.getElementById('profile-view').classList.remove('active');
  document.getElementById('main-view').style.display='';
  window.scrollTo(0,0);
};

window.switchTab = function(id,el) {
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};

/* ── RESPONSABILIDADES ── */
function renderRespTab(s) {
  const r = s.responsibilities;
  const hasTrain = r.entrenamiento.before.length||r.entrenamiento.during.length||r.entrenamiento.after.length;
  const hasMatch = r.partido.before.length||r.partido.during.length||r.partido.after.length;

  const colHtml = (items, cls, icon, label) => `
    <div class="resp-col ${cls}">
      <div class="resp-col-head">
        <div class="resp-col-icon">${icon}</div>
        <div class="resp-col-label">${label}</div>
      </div>
      <div class="resp-items">
        ${items.length
          ? items.map(i=>`<div class="resp-item">${i}</div>`).join('')
          : '<div class="resp-item wip">En construcción</div>'}
      </div>
    </div>`;

  let html = '';
  html += `<div class="resp-section">
    <div class="resp-header">
      <div class="resp-icon">⚽</div>
      <div class="resp-title">Entrenamiento</div>
    </div>
    <div class="resp-cols">
      ${colHtml(r.entrenamiento.before,'before','🕐','Antes')}
      ${colHtml(r.entrenamiento.during,'during','▶','Durante')}
      ${colHtml(r.entrenamiento.after, 'after', '✓','Después')}
    </div>
  </div>`;

  html += `<div class="resp-section">
    <div class="resp-header">
      <div class="resp-icon">🏟️</div>
      <div class="resp-title">Partido</div>
    </div>
    <div class="resp-cols">
      ${colHtml(r.partido.before,'before','🕐','Antes')}
      ${colHtml(r.partido.during,'during','▶','Durante')}
      ${colHtml(r.partido.after, 'after', '✓','Después')}
    </div>
  </div>`;

  document.getElementById('t-resp').innerHTML = html;
}

/* ── OBJECTIVES ── */
function renderObjectivesTab(s) {
  if(!s.objectives.length) {
    document.getElementById('t-objectives').innerHTML = `
      <div style="text-align:center;padding:48px;color:var(--faint)">
        <div style="font-size:32px;margin-bottom:10px;opacity:.3">🎯</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Objetivos por definir</div>
      </div>`;
    return;
  }
  let html = `<div style="margin-bottom:12px;font-size:12px;color:var(--mid)">Objetivos de temporada 2026/27 · Se actualizarán progresivamente</div>`;
  s.objectives.forEach(o => {
    html += `<div class="obj-card">
      <div class="obj-title">${o.title}</div>
      <div class="obj-desc">${o.desc}</div>
      <div class="obj-meta">
        <div class="obj-progress"><div class="obj-fill" style="width:${o.pct}%"></div></div>
        <div class="obj-pct">${o.pct}%</div>
      </div>
    </div>`;
  });
  document.getElementById('t-objectives').innerHTML = html;
}

  const row = (lbl,val) => `<div class="stat-row">

    <div class="ficha-grid">
      <div class="ficha-card">
        <div class="ficha-title">Datos del club</div>
        ${row('Club',f.club)}
