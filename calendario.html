<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Calendario · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#e8192c;--r2:rgba(232,25,44,.09);--r3:rgba(232,25,44,.2);
  --blk:#0b0b0b;--txt:#111;--mid:#6b6b6b;--faint:#b0b0b0;
  --bdr:#e2e2e2;--bg:#f3f3f1;--wh:#fff;
  /* EVENT COLORS */
  --c-entrenamiento:#e8192c;
  --c-libre:#9ca3af;
  --c-doble:#7f1d1d;
  --c-amistoso:#2563eb;
  --c-copa:#7c3aed;
  --c-liga:#15803d;
  --c-desplazamiento:#c2410c;
  --c-club:#0891b2;
  --sidebar:230px;
}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--blk);display:flex;flex-direction:column;position:relative;z-index:10;border-right:3px solid var(--r);}
.sidebar::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-back{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.28);text-transform:uppercase;cursor:pointer;background:none;border:none;padding:0;transition:color .2s;}
.sb-back:hover{color:var(--r);}
.sb-back svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.sb-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--wh);letter-spacing:.5px;line-height:1;}
.sb-name span{color:var(--r);}
.sb-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-top:3px;}
.sb-body{flex:1;padding:10px 10px;overflow-y:auto;position:relative;z-index:1;}
.sb-section{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.2);text-transform:uppercase;padding:12px 8px 4px;}
/* LEGEND */
.legend-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;cursor:pointer;transition:background .15s;margin-bottom:1px;}
.legend-item:hover{background:rgba(255,255,255,.05);}
.legend-item.off{opacity:.35;}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.legend-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.55);}
/* MINI CALENDAR */
.mini-cal{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07);margin-top:6px;}
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mc-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);}
.mc-nav{display:flex;gap:2px;}
.mc-nav button{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s;}
.mc-nav button:hover{color:var(--r);}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mc-day-hdr{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;text-align:center;color:rgba(255,255,255,.2);padding:2px 0;}
.mc-day{font-family:'JetBrains Mono',monospace;font-size:10px;text-align:center;padding:3px 2px;cursor:pointer;border-radius:2px;color:rgba(255,255,255,.35);transition:all .15s;line-height:1.4;}
.mc-day:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);}
.mc-day.today{background:var(--r);color:var(--wh);border-radius:2px;}
.mc-day.selected{background:rgba(232,25,44,.25);color:var(--wh);}
.mc-day.other-month{opacity:.25;}
.mc-day.has-events::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:var(--r);margin:1px auto 0;}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.1);transition:border-color .2s;}
.sb-user:hover{border-color:var(--r);}
.sb-av{width:28px;height:28px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--wh);flex-shrink:0;}
.sb-uname{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,.6);flex:1;letter-spacing:.04em;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--fit,#15803d);animation:dot 2s infinite;flex-shrink:0;}

/* ── MAIN ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{height:56px;background:var(--wh);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.04);gap:12px;}
.tb-nav{display:flex;align-items:center;gap:8px;}
.tb-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:4px;border:1.5px solid var(--bdr);background:var(--wh);color:var(--mid);transition:all .18s;font-size:14px;}
.tb-btn:hover{border-color:var(--r);color:var(--r);}
.tb-today{padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;height:30px;border-radius:4px;border:1.5px solid var(--bdr);background:var(--wh);color:var(--mid);transition:all .18s;}
.tb-today:hover{border-color:var(--r);color:var(--r);}
.tb-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;color:var(--txt);flex:1;}
.tb-views{display:flex;border:1.5px solid var(--bdr);border-radius:4px;overflow:hidden;}
.tb-view{padding:5px 12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);background:var(--wh);border:none;transition:all .18s;cursor:pointer;}
.tb-view:not(:last-child){border-right:1px solid var(--bdr);}
.tb-view:hover{background:var(--bg);}
.tb-view.active{background:var(--r);color:var(--wh);}
.tb-add{display:flex;align-items:center;gap:5px;padding:6px 14px;background:var(--r);color:var(--wh);border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;}
.tb-add:hover{background:#c8151f;box-shadow:0 4px 12px var(--r3);}

/* ── CALENDAR VIEWS ── */
.cal-wrap{flex:1;overflow:auto;padding:0;}

/* MONTH VIEW */
.month-view{min-height:100%;display:flex;flex-direction:column;}
.dow-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--wh);border-bottom:2px solid var(--bdr);position:sticky;top:0;z-index:5;}
.dow-cell{padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.dow-cell.weekend{color:var(--r);}
.month-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(100px,1fr));border-left:1px solid var(--bdr);border-top:1px solid var(--bdr);}
.day-cell{border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);padding:6px 8px;background:var(--wh);transition:background .15s;position:relative;overflow:hidden;min-height:100px;}
.day-cell:hover{background:#fafaf9;}
.day-cell.other-month{background:var(--bg);}
.day-cell.today .day-num{background:var(--r);color:var(--wh);border-radius:50%;}
.day-cell.weekend .day-num{color:var(--r);}
.day-cell.other-month .day-num{color:var(--faint);}
.day-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--txt);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px;transition:all .15s;flex-shrink:0;}
.day-num.holiday{color:var(--r);}
.day-holiday-name{font-size:9px;color:var(--r);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;line-height:1.2;}
.event-pill{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:3px;color:var(--wh);margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s;display:block;width:100%;}
.event-pill:hover{opacity:.85;}
.more-events{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);cursor:pointer;padding:1px 4px;transition:color .15s;}
.more-events:hover{color:var(--r);}

/* WEEK VIEW */
.week-view{min-height:100%;}
.week-header{display:grid;grid-template-columns:60px repeat(7,1fr);border-bottom:2px solid var(--bdr);background:var(--wh);position:sticky;top:0;z-index:5;}
.wh-spacer{border-right:1px solid var(--bdr);}
.wh-day{padding:8px 12px;border-right:1px solid var(--bdr);border-bottom:none;}
.wh-dow{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.wh-num{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--txt);line-height:1;}
.wh-num.today{color:var(--r);}
.week-body{display:grid;grid-template-columns:60px repeat(7,1fr);}
.week-time-col{border-right:1px solid var(--bdr);}
.week-day-col{border-right:1px solid var(--bdr);min-height:400px;padding:8px 6px;background:var(--wh);transition:background .15s;}
.week-day-col:hover{background:#fafaf9;}
.week-day-col.today-col{background:rgba(232,25,44,.02);}
.week-event{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:6px 8px;border-radius:4px;color:var(--wh);margin-bottom:4px;cursor:pointer;transition:opacity .15s;border-left:3px solid rgba(255,255,255,.3);}
.week-event:hover{opacity:.85;}
.week-event .we-time{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.75;margin-bottom:2px;}
.week-holiday{font-size:10px;color:var(--r);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;padding:3px 0;border-bottom:1px solid rgba(232,25,44,.15);}
.week-empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--faint);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

/* DAY VIEW */
.day-view{padding:24px 32px;max-width:700px;}
.dv-header{margin-bottom:24px;}
.dv-dow{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin-bottom:4px;}
.dv-date{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--txt);line-height:.9;letter-spacing:.5px;}
.dv-date.today{color:var(--r);}
.dv-holiday{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--r);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;}
.dv-event{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:14px 16px;margin-bottom:10px;border-left:4px solid;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.dv-event:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.07);}
.dv-event-type{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;opacity:.7;}
.dv-event-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--txt);}
.dv-event-meta{font-size:12px;color:var(--mid);margin-top:4px;}
.dv-empty{text-align:center;padding:60px 20px;color:var(--faint);}
.dv-empty-icon{font-size:36px;margin-bottom:10px;opacity:.3;}
.dv-empty-txt{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:var(--wh);border:1px solid var(--bdr);border-radius:8px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.15);animation:fadeUp .25s ease;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bdr);}
.modal-head h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.modal-close{background:none;border:none;font-size:22px;color:var(--faint);cursor:pointer;padding:0;line-height:1;}
.modal-close:hover{color:var(--txt);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;}
.form-control{width:100%;background:var(--bg);border:1.5px solid var(--bdr);border-radius:4px;color:var(--txt);padding:9px 12px;font-size:13px;transition:border-color .18s;}
.form-control:focus{border-color:var(--r);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;cursor:pointer;border:none;}
.btn-primary{background:var(--r);color:var(--wh);}
.btn-primary:hover{background:#c8151f;}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mid);}
.btn-ghost:hover{border-color:var(--r);color:var(--r);}
.btn-danger{background:transparent;border:1.5px solid rgba(220,38,38,.25);color:#dc2626;}
.btn-danger:hover{background:#fef2f2;}
/* Event detail modal */
.event-detail-color{height:4px;border-radius:2px;margin-bottom:16px;}
.ed-type{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;}
.ed-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--txt);line-height:.95;letter-spacing:.5px;margin-bottom:12px;}
.ed-meta{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.ed-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid);}
.ed-row strong{color:var(--txt);}
/* Type selector grid */
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.type-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;border:1.5px solid var(--bdr);cursor:pointer;transition:all .18s;}
.type-opt:hover{border-color:var(--mid);}
.type-opt.selected{border-width:2px;}
.type-opt-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.type-opt-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;}
/* User picker */
.user-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.user-opt{padding:8px 10px;border-radius:4px;border:1.5px solid var(--bdr);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--mid);transition:all .18s;text-align:center;}
.user-opt:hover{border-color:var(--r);color:var(--r);}
.user-opt.selected{background:var(--r);border-color:var(--r);color:var(--wh);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--blk);color:var(--wh);padding:11px 16px 11px 13px;border-radius:4px;border-left:3px solid var(--r);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fadeUp .3s ease;}
.toast.ok{border-left-color:#15803d;}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{display:none;}
  .month-grid{grid-template-rows:repeat(6,minmax(70px,1fr));}
  .day-cell{min-height:70px;}
  .topbar{padding:0 14px;gap:8px;}
  .tb-title{font-size:18px;}
}
@media(max-width:600px){
  .tb-views .tb-view:nth-child(2){display:none;}
  .event-pill{font-size:8px;padding:1px 4px;}
  .day-num{font-size:12px;width:20px;height:20px;}
}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-brand">
    <button class="sb-back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al Lab
    </button>
    <div class="sb-name">RACING <span>LAB</span></div>
    <div class="sb-sub">Calendario</div>
  </div>
  <div class="sb-body">
    <div class="sb-section">Tipos de evento</div>
    <div id="legend-list"></div>
    <div class="mini-cal">
      <div class="mc-head">
        <div class="mc-title" id="mini-month-title"></div>
        <div class="mc-nav">
          <button onclick="miniNav(-1)">‹</button>
          <button onclick="miniNav(1)">›</button>
        </div>
      </div>
      <div class="mc-grid">
        <div class="mc-day-hdr">L</div><div class="mc-day-hdr">M</div>
        <div class="mc-day-hdr">X</div><div class="mc-day-hdr">J</div>
        <div class="mc-day-hdr">V</div><div class="mc-day-hdr">S</div>
        <div class="mc-day-hdr">D</div>
        <div id="mini-grid"></div>
      </div>
    </div>
  </div>
  <div class="sb-foot">
    <div class="sb-user" onclick="openUserPicker()">
      <div class="sb-av" id="sb-av-initials">?</div>
      <div class="sb-uname" id="sb-uname">Seleccionar usuario</div>
      <div class="sync-dot" id="sync-dot"></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="tb-nav">
      <button class="tb-btn" onclick="navigate(-1)">‹</button>
      <button class="tb-today" onclick="goToday()">Hoy</button>
      <button class="tb-btn" onclick="navigate(1)">›</button>
    </div>
    <div class="tb-title" id="tb-title"></div>
    <div class="tb-views">
      <button class="tb-view active" onclick="setView('month',this)">Mes</button>
      <button class="tb-view" onclick="setView('week',this)">Semana</button>
      <button class="tb-view" onclick="setView('day',this)">Día</button>
    </div>
    <button class="tb-add" onclick="openAddEvent()">+ Evento</button>
  </div>

  <!-- CALENDAR CONTENT -->
  <div class="cal-wrap" id="cal-wrap"></div>
</div>
</div>

<!-- MODAL: ADD/EDIT EVENT -->
<div class="overlay" id="modal-event" onclick="overlayClose(event,'modal-event')">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-event-title">Nuevo Evento</h3>
      <button class="modal-close" onclick="closeModal('modal-event')">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" id="ev-title" placeholder="Ej: Entrenamiento tarde"/>
    </div>
    <div class="form-group">
      <label class="form-label">Tipo de evento</label>
      <div class="type-grid" id="type-grid"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Fecha</label>

<script type="module">

/* ── CONSTANTS ── */

  {title:'Amistoso',                date:'2026-08-22',type:'amistoso',    notes:''},

  {title:'Amistoso',                date:'2026-08-26',type:'amistoso',    notes:''},
  {title:'Amistoso',                date:'2026-08-29',type:'amistoso',    notes:''},

];

/* ── STATE ── */
let EVENTS        = [];
let currentView   = 'month';
let currentDate   = new Date();
let miniDate      = new Date();
let selectedType  = 'entrenamiento';
let hiddenTypes   = new Set();
let currentUser   = localStorage.getItem('rl_cal_user') || '';
let detailEventId = null;
let seeded        = false;

/* ── HELPERS ── */
const typeById  = id => EVENT_TYPES.find(t=>t.id===id) || EVENT_TYPES[0];
const dateStr   = d  => d.toISOString().slice(0,10);
const today     = ()  => dateStr(new Date());
const pad       = n  => String(n).padStart(2,'0');
function toDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a,b){ return dateStr(a)===dateStr(b); }

const MONTH_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOW_ES   = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DOW_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

function getMonthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function getMonthEnd(d)  { return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function getMondayOf(d)  {
  const day = d.getDay(); // 0=Sun
  const diff = day===0 ? -6 : 1-day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
}

function eventsForDate(dateS) {
  return EVENTS.filter(e => {
    if(hiddenTypes.has(e.type)) return false;
    if(e.date === dateS) return true;
    if(e.endDate && e.date <= dateS && e.endDate >= dateS) return true;
    return false;
  });
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  return parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

/* ── FIREBASE SYNC ── */
function startSync() {
  onSnapshot(collection(db,'calEvents'), snap => {
    EVENTS = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!seeded && EVENTS.length===0){ seedEvents(); }
    seeded = true;
    render();
    renderMiniCal();
    document.getElementById('sync-dot').style.background='#15803d';
  });
}

async function seedEvents() {
  for(const e of SEED_EVENTS) {
    await addDoc(collection(db,'calEvents'),{...e,createdBy:'Staff',createdAt:serverTimestamp()});
  }
}

/* ── LEGEND ── */
function renderLegend() {

    <div class="legend-item${hiddenTypes.has(t.id)?' off':''}" onclick="toggleType('${t.id}')">
      <div class="legend-dot" style="background:${t.color}"></div>
      <div class="legend-lbl">${t.label}</div>
    </div>`).join('');
}

window.toggleType = function(id) {
  if(hiddenTypes.has(id)) hiddenTypes.delete(id); else hiddenTypes.add(id);
  renderLegend(); render();
};

/* ── NAVIGATION ── */
window.setView = function(v, el) {
  currentView = v;
  document.querySelectorAll('.tb-view').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
};

window.navigate = function(dir) {
  if(currentView==='month'){
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+dir, 1);
  } else if(currentView==='week'){
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()+dir*7);
  } else {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()+dir);
  }
  miniDate = new Date(currentDate);
  render(); renderMiniCal();
};

window.goToday = function() {
  currentDate = new Date();
  miniDate = new Date();
  render(); renderMiniCal();
};

/* ── MINI CALENDAR ── */
window.miniNav = function(dir) {
  miniDate = new Date(miniDate.getFullYear(), miniDate.getMonth()+dir, 1);
  renderMiniCal();
};

function renderMiniCal() {
  const y = miniDate.getFullYear(), m = miniDate.getMonth();
  document.getElementById('mini-month-title').textContent = MONTH_ES[m].slice(0,3).toUpperCase()+' '+y;
  const first = new Date(y, m, 1);
  const startDow = first.getDay()===0?6:first.getDay()-1;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const datesWithEvents = new Set(EVENTS.map(e=>e.date));
  let html = '';
  // Prev month padding
  const prevDays = new Date(y, m, 0).getDate();
  for(let i=startDow-1;i>=0;i--) {
    html+=`<div class="mc-day other-month">${prevDays-i}</div>`;
  }
  const todayS = today();
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const isToday = ds===todayS;
    const hasSel = isSameDay(currentDate, new Date(y,m,d));
    const hasEv  = datesWithEvents.has(ds);
    html+=`<div class="mc-day${isToday?' today':hasSel?' selected':''}${hasEv?' has-events':''}" onclick="jumpToDate('${ds}')">${d}</div>`;
  }
  // Fill remaining
  const total = startDow+daysInMonth;
  const rem   = total%7===0?0:7-total%7;
  for(let i=1;i<=rem;i++) html+=`<div class="mc-day other-month">${i}</div>`;
  document.getElementById('mini-grid').innerHTML = html;
}

window.jumpToDate = function(ds) {
  currentDate = toDate(ds);
  if(currentView!=='day') { /* keep view */ }
  render(); renderMiniCal();
};

/* ── RENDER ── */
function render() {
  if(currentView==='month') renderMonth();
  else if(currentView==='week') renderWeek();
  else renderDay();
}

/* MONTH */
function renderMonth() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  document.getElementById('tb-title').textContent = MONTH_ES[m].toUpperCase()+' '+y;
  const first    = new Date(y,m,1);
  const startDow = first.getDay()===0?6:first.getDay()-1;
  const daysInM  = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const todayS   = today();

  let html = `<div class="month-view">
    <div class="dow-header">
      ${DOW_SHORT.map((d,i)=>`<div class="dow-cell${i>=5?' weekend':''}">${d}</div>`).join('')}
    </div>
    <div class="month-grid">`;

  // Prev month
  for(let i=startDow-1;i>=0;i--){
    const d = prevDays-i;
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    html += dayCell(d, ds, true, todayS);
  }
  // Current month
  for(let d=1;d<=daysInM;d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    html += dayCell(d, ds, false, todayS);
  }
  // Next month
  const total = startDow+daysInM;
  const rem   = total%7===0?0:7-total%7;
  for(let d=1;d<=rem;d++){
    const ds = `${y}-${pad(m+2)}-${pad(d)}`;
    html += dayCell(d, ds, true, todayS);
  }

  html += '</div></div>';
  document.getElementById('cal-wrap').innerHTML = html;
}

function dayCell(dayNum, ds, otherMonth, todayS) {
  const evs     = eventsForDate(ds);
  const isToday = ds === todayS;
  const d       = toDate(ds);
  const dow     = d.getDay();
  const isWeekend = dow===0||dow===6;
  const holiday = HOLIDAYS[ds];
  const numCls  = [
    isToday?'today':'',
    isWeekend&&!isToday?'weekend':'',
    holiday&&!isToday?'holiday':''
  ].filter(Boolean).join(' ');

  let pillsHtml = '';
  if(holiday) pillsHtml += `<div class="day-holiday-name">${holiday}</div>`;
  const MAX_PILLS = 3;
  evs.slice(0,MAX_PILLS).forEach(e=>{
    const t = typeById(e.type);
    pillsHtml += `<div class="event-pill" style="background:${t.color}" onclick="showDetail('${e.id}')" title="${e.title}">${e.time?e.time+' ':''}${e.title}</div>`;
  });
  if(evs.length>MAX_PILLS) pillsHtml += `<div class="more-events">+${evs.length-MAX_PILLS} más</div>`;

  return `<div class="day-cell${otherMonth?' other-month':''}${isToday?' today':''}${isWeekend?' weekend':''}">
    <div class="day-num ${numCls}" onclick="jumpToDateView('${ds}')">${dayNum}</div>
    ${pillsHtml}
  </div>`;
}

window.jumpToDateView = function(ds) {
  currentDate = toDate(ds);
  currentView = 'day';
  document.querySelectorAll('.tb-view').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tb-view')[2].classList.add('active');
  render(); renderMiniCal();
};

/* WEEK */
function renderWeek() {
  const mon = getMondayOf(currentDate);
  const days = Array.from({length:7},(_,i)=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i));
  const todayS = today();
  const endD = days[6];
  document.getElementById('tb-title').textContent =
    `${mon.getDate()} ${MONTH_ES[mon.getMonth()].slice(0,3)} — ${endD.getDate()} ${MONTH_ES[endD.getMonth()].slice(0,3)} ${endD.getFullYear()}`;

  let html = `<div class="week-view">
    <div class="week-header">
      <div class="wh-spacer"></div>
      ${days.map((d,i)=>`<div class="wh-day">
        <div class="wh-dow">${DOW_SHORT[i]}</div>
        <div class="wh-num${dateStr(d)===todayS?' today':''}">${d.getDate()}</div>
        ${HOLIDAYS[dateStr(d)]?`<div style="font-size:9px;color:var(--r);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em">${HOLIDAYS[dateStr(d)]}</div>`:''}
      </div>`).join('')}
    </div>
    <div class="week-body">
      <div class="week-time-col"></div>
      ${days.map((d,i)=>{
        const ds  = dateStr(d);
        const evs = eventsForDate(ds);
        const isT = ds===todayS;
        let content = '';
        if(HOLIDAYS[ds]) content+=`<div class="week-holiday">📅 ${HOLIDAYS[ds]}</div>`;
        if(evs.length){
          evs.forEach(e=>{
            const t=typeById(e.type);
            content+=`<div class="week-event" style="background:${t.color}" onclick="showDetail('${e.id}')">
              ${e.time?`<div class="we-time">${e.time}</div>`:''}
              ${e.title}
            </div>`;
          });
        } else {
          content+=`<div class="week-empty">—</div>`;
        }
        return `<div class="week-day-col${isT?' today-col':''}">${content}</div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('cal-wrap').innerHTML = html;
}

/* DAY */
function renderDay() {
  const ds     = dateStr(currentDate);
  const evs    = eventsForDate(ds);
  const todayS = today();
  const dow    = currentDate.getDay();
  const dowLbl = DOW_ES[dow===0?6:dow-1];
  const holiday= HOLIDAYS[ds];
  document.getElementById('tb-title').textContent =
    `${dowLbl}, ${currentDate.getDate()} ${MONTH_ES[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

  let html = `<div class="day-view">
    <div class="dv-header">
      <div class="dv-dow">${dowLbl}</div>
      <div class="dv-date${ds===todayS?' today':''}">${currentDate.getDate()} ${MONTH_ES[currentDate.getMonth()].toUpperCase()}</div>
      ${holiday?`<div class="dv-holiday">📅 ${holiday}</div>`:''}
    </div>`;

  if(evs.length){
    evs.forEach(e=>{
      const t=typeById(e.type);
      html+=`<div class="dv-event" style="border-left-color:${t.color}" onclick="showDetail('${e.id}')">
        <div class="dv-event-type" style="color:${t.color}">${t.label}</div>
        <div class="dv-event-title">${e.title}</div>
        <div class="dv-event-meta">
          ${e.time?`<span>⏰ ${e.time}</span> &nbsp;`:''}
          ${e.location?`<span>📍 ${e.location}</span> &nbsp;`:''}
          ${e.createdBy?`<span>👤 ${e.createdBy}</span>`:''}
        </div>
        ${e.notes?`<div style="font-size:12px;color:var(--mid);margin-top:6px;line-height:1.5">${e.notes}</div>`:''}
      </div>`;
    });
  } else {
    html+=`<div class="dv-empty">
      <div class="dv-empty-icon">📅</div>
      <div class="dv-empty-txt">Sin eventos · <button class="btn btn-primary" onclick="openAddEventDate('${ds}')" style="vertical-align:middle">+ Añadir</button></div>
    </div>`;
  }
  html+='</div>';
  document.getElementById('cal-wrap').innerHTML = html;
}

/* ── EVENT DETAIL ── */
window.showDetail = function(id) {
  const e = EVENTS.find(ev=>ev.id===id);
  if(!e) return;
  detailEventId = id;
  const t = typeById(e.type);
  document.getElementById('detail-color').style.background = t.color;
  document.getElementById('detail-type').textContent = t.label.toUpperCase();
  document.getElementById('detail-title').textContent = e.title;
  let meta = '';
  meta+=`<div class="ed-row">📅 <strong>${e.date}</strong>${e.endDate&&e.endDate!==e.date?' → '+e.endDate:''}</div>`;
  if(e.time)     meta+=`<div class="ed-row">⏰ <strong>${e.time}</strong></div>`;
  if(e.location) meta+=`<div class="ed-row">📍 <strong>${e.location}</strong></div>`;
  if(e.notes)    meta+=`<div class="ed-row">📝 ${e.notes}</div>`;
  if(e.createdBy)meta+=`<div class="ed-row">👤 ${e.createdBy}</div>`;
  document.getElementById('detail-meta').innerHTML = meta;
  openModal('modal-detail');
};

window.editFromDetail = function() {
  closeModal('modal-detail');
  const e = EVENTS.find(ev=>ev.id===detailEventId);
  if(e) openEditEvent(e);

      <div class="type-opt-lbl" style="color:${sel===t.id?t.color:''}">${t.label}</div>
    </div>`).join('');
}

function buildUserSelect() {
  document.getElementById('ev-user').innerHTML =
    STAFF.map(s=>`<option value="${s}"${s===currentUser?' selected':''}>${s}</option>`).join('');
}

window.openAddEvent = function(prefillDate) {
  document.getElementById('modal-event-title').textContent = 'Nuevo Evento';
  document.getElementById('ev-title').value    = '';
  document.getElementById('ev-date').value     = prefillDate||dateStr(currentDate);
  document.getElementById('ev-end-date').value = '';
  document.getElementById('ev-time').value     = '';
  document.getElementById('ev-location').value = '';
  document.getElementById('ev-notes').value    = '';
  document.getElementById('ev-edit-id').value  = '';
  document.getElementById('btn-delete-event').style.display = 'none';
  selectedType = 'entrenamiento';
  buildTypeGrid(selectedType);
  buildUserSelect();
  openModal('modal-event');
};

window.openAddEventDate = function(ds) { openAddEvent(ds); };

function openEditEvent(e) {
  document.getElementById('modal-event-title').textContent = 'Editar Evento';
  document.getElementById('ev-title').value    = e.title||'';
  document.getElementById('ev-date').value     = e.date||'';
  document.getElementById('ev-end-date').value = e.endDate||'';
  document.getElementById('ev-time').value     = e.time||'';
  document.getElementById('ev-location').value = e.location||'';
  document.getElementById('ev-notes').value    = e.notes||'';
  document.getElementById('ev-edit-id').value  = e.id;
  document.getElementById('btn-delete-event').style.display = 'inline-flex';
  selectedType = e.type||'entrenamiento';
  buildTypeGrid(selectedType);
  buildUserSelect();
  if(e.createdBy) document.getElementById('ev-user').value = e.createdBy;
  openModal('modal-event');
}

window.selectType = function(id) {
  selectedType = id;
  buildTypeGrid(id);
};

window.saveEvent = async function() {
  const title = document.getElementById('ev-title').value.trim();
  const date  = document.getElementById('ev-date').value;
  if(!title||!date){ showToast('Título y fecha son obligatorios','err'); return; }
  const data = {
    title, date,
    type:     selectedType,
    endDate:  document.getElementById('ev-end-date').value||null,
    time:     document.getElementById('ev-time').value||null,
    location: document.getElementById('ev-location').value.trim()||null,
    notes:    document.getElementById('ev-notes').value.trim()||null,
    createdBy:document.getElementById('ev-user').value||currentUser||'Staff',
  };
  const editId = document.getElementById('ev-edit-id').value;
  if(editId){
    await updateDoc(doc(db,'calEvents',editId),{...data,updatedAt:serverTimestamp()});
    showToast('Evento actualizado','ok');
  } else {
    await addDoc(collection(db,'calEvents'),{...data,createdAt:serverTimestamp()});
    showToast('Evento guardado','ok');
  }
  closeModal('modal-event');
};

window.deleteCurrentEvent = async function() {
  const id = document.getElementById('ev-edit-id').value;
  if(!id||!confirm('¿Eliminar este evento?')) return;
  await deleteDoc(doc(db,'calEvents',id));
  closeModal('modal-event');
  showToast('Evento eliminado');
};

/* ── MODAL UTILS ── */
window.openModal    = id => document.getElementById(id).classList.add('open');
window.closeModal   = id => document.getElementById(id).classList.remove('open');
window.overlayClose = (e,id) => { if(e.target.classList.contains('overlay')) closeModal(id); };

let toastTimer = null;
window.showToast = function(msg, type='') {
  let t = document.querySelector('.toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='toast '+(type==='ok'?'ok':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),3000);
};

/* ── INIT ── */
renderLegend();
renderMiniCal();
updateUserUI();
if(!currentUser) {
  setTimeout(()=>openUserPicker(), 800);
}
document.getElementById('sync-dot').style.background = '#9ca3af';
startSync();

</script>
</body>
</html>
