<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<title>2 Verdades y 1 Mentira · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Chivo:wght@400;500;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#CC3334;--r2:rgba(204,51,52,.09);
  --bg:#f4f2ee;--surface:#fbfaf8;--surface-2:#f0ede8;
  --ink:#14110f;--ink-2:#45413b;--ink-3:#797269;--line:#e2ddd5;
}
html,body{min-height:100%;font-family:'Chivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;outline:none;}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 60px;}
.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:.9;}
.brand span{color:var(--r);}
.sub{font-family:'Chivo Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;}
.rule{height:2px;background:var(--r);margin:18px 0 22px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:0 8px 28px rgba(0,0,0,.06);}
.lbl{display:block;font-family:'Chivo Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;}
select,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:12px 13px;font-size:14.5px;color:var(--ink);margin-bottom:16px;}
textarea{resize:vertical;min-height:52px;line-height:1.4;}
select:focus,textarea:focus{border-color:var(--r);}
.lie textarea{border-color:#CC3334;background:rgba(204,51,52,.05);}
.taghint{font-size:11px;color:var(--ink-3);margin:-10px 0 16px;line-height:1.4;}
.counter{text-align:right;font-size:10.5px;color:var(--ink-3);margin-top:-14px;margin-bottom:14px;}
.btn{width:100%;background:var(--r);color:#fff;border:none;border-radius:9px;padding:14px;font-size:14px;font-weight:700;letter-spacing:.04em;font-family:'Bricolage Grotesque',system-ui,sans-serif;}
.btn:disabled{opacity:.5;}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-2);}
.msg{font-size:12.5px;border-radius:8px;padding:10px 12px;margin-bottom:15px;line-height:1.45;display:none;}
.msg.ok{display:block;background:rgba(21,128,61,.09);color:#15803d;}
.msg.err{display:block;background:rgba(204,51,52,.09);color:#c02231;}
.msg.info{display:block;background:rgba(0,0,0,.05);color:var(--ink-2);}
.hidden{display:none;}
.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--ink-3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">RACING <span>LAB</span></div>
  <div class="sub">2 verdades y 1 mentira · dinámica de equipo</div>
  <div class="rule"></div>

  <div class="card">
    <div id="msg-box"></div>

    <label class="lbl" for="jugador">¿Quién eres?</label>
    <select id="jugador" onchange="seleccionarJugador()">
      <option value="">— Elige tu nombre —</option>
    </select>

    <div id="form-body" class="hidden">
      <label class="lbl">Verdad 1</label>
      <textarea id="v1" maxlength="200" placeholder="Algo que sea verdad sobre ti…" oninput="contar()"></textarea>

      <label class="lbl">Verdad 2</label>
      <textarea id="v2" maxlength="200" placeholder="Otra verdad…" oninput="contar()"></textarea>

      <label class="lbl">Mentira</label>
      <div class="lie">
        <textarea id="m1" maxlength="200" placeholder="Algo creíble… pero falso" oninput="contar()"></textarea>
      </div>
      <div class="taghint">Esta es la que el resto tiene que descubrir. No se le marca a nadie: solo el cuerpo técnico la ve señalada en su pantalla.</div>

      <button class="btn" id="btn-enviar" onclick="enviar()">Guardar mis 3 frases</button>
    </div>
  </div>

  <div class="foot">Racing Club Portuense · Tercera RFEF Grupo X</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const CONFIG = {
  apiKey:"AIzaSyBNDylPVfge6SFXVfJAcna9v7qh_CffI7Y",
  authDomain:"racing-portuense-scouting.firebaseapp.com",
  projectId:"racing-portuense-scouting",
  storageBucket:"racing-portuense-scouting.firebasestorage.app",
  messagingSenderId:"1073919975511",
  appId:"1:1073919975511:web:7c7f59495d1f67f6f44312"
};
const app = getApps().length ? getApps()[0] : initializeApp(CONFIG);
const db = getFirestore(app);

/* ── Plantilla activa ──────────────────────────────────────────────────
   Lista estática a propósito: esta página la abre cualquiera sin cuenta
   desde el QR, así que no lee la colección 'players' (reglas de
   Firestore la reservan a usuarios identificados). Si entra o sale
   alguien de la plantilla, actualiza este array a mano y vuelve a
   publicar el archivo — igual que con cualquier otro cambio de plantilla
   en una web estática sin backend. */
const JUGADORES = [
  'Adri Cuevas','Adri Rodríguez','Amengual','Brandon','Carmelo','Farrando',
  'Fuentes','Héctor Peña','Hugo Rodríguez','Jacobo','Javi Tamayo',
  'Jesús Castaño','Josema','Juanma','Lainez','Lolo Garrido','Luca',
  'Luis Ortega','Lupu','Marcos','Marcos Talavera','Nando Valencia','Rodri',
  'Rodrigo Sanz','Rubén Sánchez','Víctor Olmo'
].sort((a,b)=>a.localeCompare(b,'es'));

function slug(n){
  return n.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

const sel = document.getElementById('jugador');
JUGADORES.forEach(n=>{
  const o = document.createElement('option');
  o.value = slug(n); o.textContent = n;
  sel.appendChild(o);
});

window.seleccionarJugador = async function(){
  const id = sel.value;
  const body = document.getElementById('form-body');
  const box = document.getElementById('msg-box');
  box.innerHTML = '';
  if(!id){ body.classList.add('hidden'); return; }
  body.classList.remove('hidden');
  document.getElementById('v1').value = '';
  document.getElementById('v2').value = '';
  document.getElementById('m1').value = '';
  try{
    const snap = await getDoc(doc(db,'dosVerdadesMentira',id));
    if(snap.exists()){
      const d = snap.data();
      const af = d.afirmaciones || [];
      document.getElementById('v1').value = af[0]?.texto || '';
      document.getElementById('v2').value = af[1]?.texto || '';
      document.getElementById('m1').value = af[2]?.texto || '';
      box.innerHTML = '<div class="msg info">Ya habías respondido. Puedes revisarlo y guardar de nuevo — se sobreescribe.</div>';
    }
  }catch(e){
    console.error(e);
    box.innerHTML = '<div class="msg err">No se pudo comprobar si ya habías respondido. Puedes seguir y guardar igual.</div>';
  }
};

window.contar = function(){};

window.enviar = async function(){
  const id = sel.value;
  const nombre = sel.options[sel.selectedIndex]?.textContent || '';
  const v1 = document.getElementById('v1').value.trim();
  const v2 = document.getElementById('v2').value.trim();
  const m1 = document.getElementById('m1').value.trim();
  const box = document.getElementById('msg-box');
  const btn = document.getElementById('btn-enviar');

  if(!id){ box.innerHTML = '<div class="msg err">Elige primero tu nombre.</div>'; return; }
  if(!v1 || !v2 || !m1){
    box.innerHTML = '<div class="msg err">Rellena las 3 frases — dos verdades y una mentira.</div>';
    return;
  }

  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    await setDoc(doc(db,'dosVerdadesMentira',id), {
      nombre,
      afirmaciones: [
        {texto:v1, esMentira:false},
        {texto:v2, esMentira:false},
        {texto:m1, esMentira:true},
      ],
      actualizadoEn: serverTimestamp(),
    });
    box.innerHTML = '<div class="msg ok">Guardado. Ya puedes dejarle el móvil al siguiente.</div>';
    btn.textContent = 'Guardado ✓';
  }catch(e){
    console.error(e);
    box.innerHTML = '<div class="msg err">No se pudo guardar. Revisa la conexión e inténtalo otra vez.</div>';
    btn.disabled = false; btn.textContent = 'Guardar mis 3 frases';
  }
};
</script>
</body>
</html>
