<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Plantilla · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#e8192c;--r2:rgba(232,25,44,.09);--r3:rgba(232,25,44,.2);
  --blk:#0b0b0b;--txt:#111;--mid:#6b6b6b;--faint:#b0b0b0;
  --bdr:#e2e2e2;--bg:#f3f3f1;--wh:#fff;
  --fit:#15803d;--fit-bg:#f0fdf4;
  --warn:#c2410c;--warn-bg:#fff7ed;
  --inj:#dc2626;--inj-bg:#fef2f2;
  --sidebar:240px;
}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}

.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--blk);display:flex;flex-direction:column;position:relative;z-index:10;border-right:3px solid var(--r);}
.sidebar::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-back{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.28);text-transform:uppercase;cursor:pointer;background:none;border:none;padding:0;transition:color .2s;}
.sb-back:hover{color:var(--r);}
.sb-back svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.sb-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--wh);letter-spacing:.5px;line-height:1;}
.sb-name span{color:var(--r);}
.sb-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-top:4px;}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;position:relative;z-index:1;}
.sb-section{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.2);text-transform:uppercase;padding:14px 10px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;cursor:pointer;transition:all .18s;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.4);margin-bottom:1px;border-left:2px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);}
.nav-item.active{background:rgba(232,25,44,.12);color:var(--wh);border-left-color:var(--r);}
.nav-icon{width:18px;text-align:center;font-size:13px;flex-shrink:0;}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-foot-txt{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{height:58px;background:var(--wh);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex-shrink:0;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:.1em;color:var(--txt);text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* PAGES */
.page{display:none;padding:32px 36px 48px;animation:fadeUp .3s ease;}
.page.active{display:block;}

/* UTILS */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:10px;}
.st{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.1em;color:var(--txt);text-transform:uppercase;}
.sc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);}
.card{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:20px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:16px;border-left:3px solid transparent;transition:border-color .2s;}
.kpi:hover{border-left-color:var(--r);}
.kv{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--txt);line-height:1;}
.kv.red{color:var(--r);}.kv.green{color:var(--fit);}.kv.amber{color:var(--warn);}
.kl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-top:3px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;cursor:pointer;border:none;}
.btn-primary{background:var(--r);color:var(--wh);}
.btn-primary:hover{background:#c8151f;box-shadow:0 4px 12px var(--r3);}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mid);}
.btn-ghost:hover{border-color:var(--r);color:var(--r);}
.btn-danger{background:transparent;border:1.5px solid rgba(220,38,38,.25);color:var(--inj);}
.btn-danger:hover{background:var(--inj-bg);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* STATUS PILL */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:2px;text-transform:uppercase;}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.pill-green{background:var(--fit-bg);color:var(--fit);}
.pill-green::before{animation:dot 2s infinite;}
.pill-amber{background:var(--warn-bg);color:var(--warn);}
.pill-red{background:var(--inj-bg);color:var(--inj);}
.pill-gray{background:#f5f5f5;color:var(--mid);}

/* FILTER TABS */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.ftab{padding:5px 12px;border-radius:3px;border:1.5px solid var(--bdr);background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);cursor:pointer;transition:all .18s;}
.ftab:hover{border-color:var(--r);color:var(--r);}
.ftab.active{background:var(--r);border-color:var(--r);color:var(--wh);}

/* POSITION GROUP */
.pos-group{margin-bottom:32px;}
.pos-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.pos-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--txt);}
.pos-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);}
.pos-line{flex:1;height:1px;background:var(--bdr);}

/* PLAYER GRID */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.player-card{background:var(--wh);border:1px solid var(--bdr);border-left:3px solid transparent;border-radius:6px;padding:16px 14px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden;}
.player-card::after{content:attr(data-d);position:absolute;right:-6px;bottom:-10px;font-family:'Bebas Neue',sans-serif;font-size:72px;color:rgba(0,0,0,.04);line-height:1;pointer-events:none;}
.player-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-left-color:var(--r);}
.player-card.inactive{opacity:.45;filter:grayscale(.5);}
.pc-avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--blk);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:rgba(255,255,255,.35);margin-bottom:10px;flex-shrink:0;border:1px solid var(--bdr);}
.pc-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
.ph-photo{width:92px;height:92px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:32px;color:rgba(255,255,255,.3);flex-shrink:0;border:2px solid rgba(255,255,255,.15);margin-right:20px;}
.ph-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
.pc-dorsal{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--faint);letter-spacing:.5px;margin-bottom:4px;}
.pc-nick{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--txt);line-height:1.1;margin-bottom:2px;}
.pc-name{font-size:11px;color:var(--mid);margin-bottom:10px;line-height:1.3;}
.pc-dem{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--r);margin-bottom:8px;}
.pc-stats{display:flex;gap:10px;flex-wrap:wrap;}
.pc-stat{font-size:11px;color:var(--faint);}
.pc-stat strong{color:var(--mid);font-weight:600;}

/* PROFILE PAGE */
.profile-back{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);cursor:pointer;background:none;border:none;padding:0;margin-bottom:20px;transition:color .2s;}
.profile-back:hover{color:var(--r);}
.profile-back svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.profile-hero{background:var(--blk);border-radius:8px;padding:28px 32px;margin-bottom:24px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;}
.profile-hero::after{content:attr(data-dorsal);position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:160px;color:rgba(255,255,255,.04);line-height:1;pointer-events:none;}
.ph-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.ph-left{}
.ph-dorsal{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--r);text-transform:uppercase;margin-bottom:6px;}
.ph-nick{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--wh);line-height:.9;letter-spacing:.5px;}
.ph-fullname{font-size:13px;color:rgba(255,255,255,.4);margin-top:6px;font-weight:300;}
.ph-right{display:flex;gap:20px;flex-wrap:wrap;}
.ph-meta{text-align:center;}
.ph-meta-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--wh);}
.ph-meta-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:2px;}

/* PROFILE TABS */
.profile-tabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:24px;gap:0;}
.ptab{padding:10px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;background:none;border-top:none;border-left:none;border-right:none;}
.ptab:hover{color:var(--txt);}
.ptab.active{color:var(--r);border-bottom-color:var(--r);}
.tab-content{display:none;}
.tab-content.active{display:block;animation:fadeIn .25s ease;}

/* PROFILE SECTIONS */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(226,226,226,.6);}
.stat-row:last-child{border-bottom:none;}
.stat-lbl{font-size:13px;color:var(--mid);}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--txt);}
.stat-val.red{color:var(--r);}
.module-link{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border:1px solid var(--bdr);border-radius:4px;margin-top:10px;cursor:pointer;transition:all .18s;text-decoration:none;}
.module-link:hover{border-color:var(--r);background:var(--r2);}
.module-link-txt{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);}
.module-link:hover .module-link-txt{color:var(--r);}
.module-link-arr{color:var(--faint);font-size:14px;}
.big-number{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--txt);line-height:1;}
.big-number.red{color:var(--r);}
.big-number.green{color:var(--fit);}
.progress-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:3px;transition:width .6s ease;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:var(--wh);border:1px solid var(--bdr);border-radius:8px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.15);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bdr);}
.modal-head h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.modal-close{background:none;border:none;font-size:22px;color:var(--faint);cursor:pointer;padding:0;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;}
.form-control{width:100%;background:var(--bg);border:1.5px solid var(--bdr);border-radius:4px;color:var(--txt);padding:9px 12px;font-size:13px;transition:border-color .18s;}
.form-control:focus{border-color:var(--r);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr);}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--blk);color:var(--wh);padding:12px 18px 12px 14px;border-radius:4px;border-left:3px solid var(--r);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease;}
.toast.ok{border-left-color:var(--fit);}
.toast.err{border-left-color:var(--inj);}

@media(max-width:900px){.sidebar{display:none;}.two-col,.three-col{grid-template-columns:1fr;}}
@media(max-width:600px){.page{padding:18px 14px 36px;}.topbar{padding:0 16px;}.player-grid{grid-template-columns:1fr 1fr;}.form-row,.form-row-3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-brand">
    <button class="sb-back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al Lab
    </button>
    <div class="sb-name">RACING <span>LAB</span></div>
    <div class="sb-sub">Plantilla</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">Gestión</div>
    <div class="nav-item active" onclick="nav('p-squad',this)"><span class="nav-icon">◫</span>Plantilla</div>
    <div class="nav-item" onclick="nav('p-inactive',this)"><span class="nav-icon">◐</span>Bajas</div>
    <div class="sb-section">Información</div>
    <div class="nav-item" onclick="nav('p-stats',this)"><span class="nav-icon">◉</span>Estadísticas</div>
  </nav>
  <div class="sb-foot"><div class="sb-foot-txt">Racing Club Portuense · 2026/27</div></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Plantilla</div>
    <div class="topbar-right">
      <button class="btn btn-primary btn-sm" id="btn-add-player" onclick="openAddPlayer()">+ Jugador</button>
    </div>
  </div>

  <!-- SQUAD LIST -->
  <div class="page active" id="p-squad">
    <div class="kpi-grid" id="squad-kpis"></div>
    <div class="ftabs">
      <button class="ftab active" onclick="filterSquad('',this)">Todos</button>
      <button class="ftab" onclick="filterSquad('POR',this)">Porteros</button>
      <button class="ftab" onclick="filterSquad('DEF',this)">Defensas</button>
      <button class="ftab" onclick="filterSquad('MED',this)">Centrocampistas</button>
      <button class="ftab" onclick="filterSquad('DEL',this)">Delanteros</button>
    </div>
    <div id="squad-content"></div>
  </div>

  <!-- INACTIVE -->
  <div class="page" id="p-inactive">
    <div class="sh"><div class="st">Bajas</div><div class="sc" id="inactive-count"></div></div>
    <div id="inactive-content"></div>
  </div>

  <!-- STATS -->
  <div class="page" id="p-stats">
    <div class="sh"><div class="st">Estadísticas de Plantilla</div><div class="sc">Temporada 2026/27</div></div>
    <div class="three-col" id="stats-cards"></div>
  </div>

  <!-- PLAYER PROFILE (overlays above pages) -->
  <div class="page" id="p-profile">
    <button class="profile-back" onclick="closeProfile()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver a plantilla
    </button>
    <div class="profile-hero" id="profile-hero-block" data-dorsal="">
      <div class="ph-inner">
        <div class="ph-photo" id="ph-photo"></div>
        <div class="ph-left">
          <div class="ph-dorsal" id="ph-pos"></div>
          <div class="ph-nick" id="ph-nick"></div>
          <div class="ph-fullname" id="ph-fullname"></div>
        </div>
        <div class="ph-right" id="ph-meta-cols"></div>
      </div>
    </div>
    <div class="profile-tabs">
      <button class="ptab active" onclick="switchTab('t-info',this)">Información</button>
      <button class="ptab" onclick="switchTab('t-perf',this)">Físico & Lesiones</button>
      <button class="ptab" onclick="switchTab('t-att',this)">Asistencia</button>
      <button class="ptab" onclick="switchTab('t-fines',this)">Multas</button>
    </div>
    <div id="t-info" class="tab-content active"></div>
    <div id="t-perf" class="tab-content"></div>
    <div id="t-att" class="tab-content"></div>
    <div id="t-fines" class="tab-content"></div>
  </div>

</div><!-- /main -->
</div><!-- /app -->

<!-- MODAL: AÑADIR JUGADOR -->
<div class="overlay" id="modal-add-player" onclick="overlayClose(event,'modal-add-player')">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-player-title">Nuevo Jugador</h3>
      <button class="modal-close" onclick="closeModal('modal-add-player')">×</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Dorsal</label>
        <input type="number" class="form-control" id="np-dorsal" min="0" max="99" placeholder="—"/>
      </div>
      <div class="form-group">
        <label class="form-label">Apodo</label>
        <input type="text" class="form-control" id="np-nick" placeholder="Ej: Rodri"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre completo</label>
      <input type="text" class="form-control" id="np-name" placeholder="Nombre y apellidos"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Posición</label>

const DEM_BY_POS = {
  POR:['Portero'],
  DEF:['Central','Lateral Derecho','Lateral Izquierdo','Carrilero'],
  MED:['Medio Centro','MC Defensivo','MC Ofensivo','Media Punta','Interior'],
  DEL:['Delantero Centro','Extremo Derecho','Extremo Izquierdo','Delantero']
};
const POS_NAMES = {POR:'Porteros',DEF:'Defensas',MED:'Centrocampistas',DEL:'Delanteros'};
const STATUS_CLS = {fit:'pill-green',caution:'pill-amber',injury:'pill-red'};
const STATUS_LBL = {fit:'Disponible',caution:'Precaución',injury:'Lesionado'};

/* ── STORAGE ── */
function loadPlayers(){
  try{
    const s=localStorage.getItem('rl_players');
    if(s) return JSON.parse(s);
  }catch(e){}
  // Migrate from performance module if exists
  try{
    const perf=localStorage.getItem('rl_perf_v2');
    if(perf){
      const d=JSON.parse(perf);
      if(d.players&&d.players.length){
        const migrated=d.players.map(p=>({...p,active:p.active!==false,joined:p.joined||'2026-07-01',notes:p.notes||''}));
        localStorage.setItem('rl_players',JSON.stringify(migrated));
        return migrated;
      }
    }
  }catch(e){}
  localStorage.setItem('rl_players',JSON.stringify(DEFAULT_PLAYERS));
  return JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
}
function savePlayers(){ localStorage.setItem('rl_players',JSON.stringify(PLAYERS)); syncToPerf(); }

// Keep performance module in sync
function syncToPerf(){
  try{
    const s=localStorage.getItem('rl_perf_v2');
    const perf=s?JSON.parse(s):{injuries:[],tests:[]};
    perf.players=PLAYERS;
    localStorage.setItem('rl_perf_v2',JSON.stringify(perf));
  }catch(e){}
}

// Cross-module readers
function getPerfData(){ try{const s=localStorage.getItem('rl_perf_v2');return s?JSON.parse(s):{injuries:[],tests:[]};}catch(e){return{injuries:[],tests:[]};} }
function getAttData(){ try{const s=localStorage.getItem('rl_att_v1');return s?JSON.parse(s):{attendance:[],fines:[],fineTypes:[]};}catch(e){return{attendance:[],fines:[],fineTypes:[]};} }

let PLAYERS = loadPlayers();
let currentFilter = '';
let currentProfileId = null;
let previousPage = 'p-squad';

/* ── NAVIGATION ── */
function nav(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('page-title').textContent =
    {'p-squad':'Plantilla','p-inactive':'Bajas','p-stats':'Estadísticas'}[id]||'Plantilla';
  document.getElementById('btn-add-player').style.display = id==='p-squad'?'':'none';
  renderPage(id);
}
function renderPage(id){
  if(id==='p-squad') renderSquad(currentFilter);
  if(id==='p-inactive') renderInactive();
  if(id==='p-stats') renderStats();
}

/* ── SQUAD LIST ── */
function renderSquad(filter){
  currentFilter = filter;
  const active = PLAYERS.filter(p=>p.active);
  const tot = active.length;
  const perf = getPerfData();
  const fit = active.filter(p=>{
    const inj = (perf.injuries||[]).find(i=>i.pid===p.id&&i.active);
    return !inj;
  }).length;

  document.getElementById('squad-kpis').innerHTML=`
    <div class="kpi"><div class="kv">${tot}</div><div class="kl">Jugadores</div></div>
    <div class="kpi"><div class="kv green">${fit}</div><div class="kl">Disponibles</div></div>
    <div class="kpi"><div class="kv red">${tot-fit}</div><div class="kl">Lesionados/baja</div></div>
    <div class="kpi"><div class="kv">${active.filter(p=>p.pos==='POR').length}</div><div class="kl">Porteros</div></div>
    <div class="kpi"><div class="kv">${active.filter(p=>p.pos==='DEF').length}</div><div class="kl">Defensas</div></div>
    <div class="kpi"><div class="kv">${active.filter(p=>p.pos==='MED').length}</div><div class="kl">Centrocampistas</div></div>
    <div class="kpi"><div class="kv">${active.filter(p=>p.pos==='DEL').length}</div><div class="kl">Delanteros</div></div>
  `;

  let players = filter ? active.filter(p=>p.pos===filter) : active;
  players = players.sort((a,b)=>a.d-b.d||a.nick.localeCompare(b.nick));

  if(!filter){
    const html = ['POR','DEF','MED','DEL'].map(pos=>{
      const group = players.filter(p=>p.pos===pos);
      if(!group.length) return '';
      return `<div class="pos-group">
        <div class="pos-header">
          <div class="pos-label">${POS_NAMES[pos]}</div>
          <div class="pos-count">${group.length} jugadores</div>
          <div class="pos-line"></div>
        </div>
        <div class="player-grid">${group.map(p=>playerCardHtml(p,perf)).join('')}</div>
      </div>`;
    }).join('');
    document.getElementById('squad-content').innerHTML = html;
  } else {
    document.getElementById('squad-content').innerHTML =
      `<div class="player-grid">${players.map(p=>playerCardHtml(p,perf)).join('')}</div>`;
  }
}

function filterSquad(f,el){
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderSquad(f);
}

function playerCardHtml(p,perf){
  const inj = (perf.injuries||[]).find(i=>i.pid===p.id&&i.active);
  const statusCls = inj ? 'pill-red' : 'pill-green';
  const statusLbl = inj ? 'Lesionado' : 'Disponible';
  const lastTest = (perf.tests||[]).filter(t=>t.pid===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const attData = getAttData();
  const sessions = (attData.attendance||[]).length;
  const present = (attData.attendance||[]).filter(s=>s.results.find(r=>r.playerId===p.id&&r.present)).length;
  const attPct = sessions ? Math.round(present/sessions*100) : null;

  return `<div class="player-card" data-d="${p.d||''}" onclick="openProfile('${p.id}')">
    <div class="pc-dorsal">${p.d ? '#'+p.d : '—'}</div>
    <div class="pc-avatar">${p.photo?`<img src="${p.photo}" alt="" onerror="this.parentElement.innerHTML='${initials(p.nick)}'"/>`:initials(p.nick)}</div>
    <div class="pc-nick">${p.nick}</div>
    <div class="pc-name">${p.n}</div>
    <div class="pc-dem">${p.dem}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">
      <span class="pill ${statusCls}">${statusLbl}</span>
      <div class="pc-stats">
        ${p.age?`<span class="pc-stat"><strong>${p.age}</strong> años</span>`:''}
        ${attPct!==null?`<span class="pc-stat"><strong>${attPct}%</strong> asist.</span>`:''}
        ${lastTest?`<span class="pc-stat">Test: <strong>${lastTest.date.slice(5)}</strong></span>`:''}
      </div>
    </div>
  </div>`;
}
function initials(name){
  const p=(name||'').trim().split(/\s+/);
  return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(name||'?').slice(0,2).toUpperCase();
}

/* ── INACTIVE ── */
function renderInactive(){
  const inactive = PLAYERS.filter(p=>!p.active);
  document.getElementById('inactive-count').textContent = inactive.length+' jugadores dados de baja';
  document.getElementById('inactive-content').innerHTML = inactive.length
    ? `<div class="player-grid">${inactive.map(p=>{
        return `<div class="player-card inactive" data-d="${p.d||''}">
          <div class="pc-dorsal">${p.d?'#'+p.d:'—'}</div>
          <div class="pc-nick">${p.nick}</div>
          <div class="pc-name">${p.n}</div>
          <div class="pc-dem">${p.dem}</div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <span class="pill pill-gray">Baja · ${p.deactivated_reason||'—'}</span>
            ${p.deactivated_date?`<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)">${p.deactivated_date}</span>`:''}
          </div>
          <button class="btn btn-ghost btn-sm" style="margin-top:10px;width:100%" onclick="reactivate('${p.id}')">Reactivar</button>
        </div>`;
      }).join('')}</div>`
    : '<div class="card" style="text-align:center;padding:32px;color:var(--faint);font-family:\'Barlow Condensed\',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Sin bajas registradas</div>';
}

/* ── STATS ── */
function renderStats(){
  const active = PLAYERS.filter(p=>p.active);
  const ages = active.filter(p=>p.age>0).map(p=>p.age);
  const avgAge = ages.length ? (ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1) : '—';
  const perf = getPerfData();
  const inj = (perf.injuries||[]).filter(i=>i.active).length;
  const tests = (perf.tests||[]).length;
  document.getElementById('stats-cards').innerHTML = `
    <div class="card">
      <div class="card-title">Edad media</div>
      <div class="big-number">${avgAge}</div>
      <div style="font-size:12px;color:var(--mid);margin-top:4px">años · plantilla activa</div>
    </div>
    <div class="card">
      <div class="card-title">Lesionados activos</div>
      <div class="big-number red">${inj}</div>
      <div style="font-size:12px;color:var(--mid);margin-top:4px">de ${active.length} jugadores</div>
    </div>
    <div class="card">
      <div class="card-title">Tests físicos registrados</div>
      <div class="big-number">${tests}</div>
      <div style="font-size:12px;color:var(--mid);margin-top:4px">temporada 2026/27</div>
    </div>
  `;
}

/* ── PLAYER PROFILE ── */
function openProfile(pid){
  currentProfileId = pid;
  previousPage = document.querySelector('.page.active')?.id || 'p-squad';
  const p = PLAYERS.find(pl=>pl.id===pid);
  if(!p) return;
  const perf = getPerfData();
  const att = getAttData();

  // Hero
  document.getElementById('profile-hero-block').setAttribute('data-dorsal', p.d||'');
  document.getElementById('ph-photo').innerHTML = p.photo
    ? `<img src="${p.photo}" alt="" onerror="this.parentElement.textContent='${initials(p.nick)}'"/>`
    : initials(p.nick);
  document.getElementById('ph-pos').textContent = POS_NAMES[p.pos]+' · '+p.dem;
  document.getElementById('ph-nick').textContent = p.nick.toUpperCase();
  document.getElementById('ph-fullname').textContent = p.n;
  document.getElementById('ph-meta-cols').innerHTML = [
    {lbl:'Dorsal',val:p.d||'—'},
    {lbl:'Edad',val:p.age||'—'},
    {lbl:'Posición',val:p.pos},
  ].map(m=>`<div class="ph-meta"><div class="ph-meta-val">${m.val}</div><div class="ph-meta-lbl">${m.lbl}</div></div>`).join('');

  // Switch to profile page
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  document.getElementById('p-profile').classList.add('active');
  document.getElementById('page-title').textContent = p.nick;
  document.getElementById('btn-add-player').style.display = 'none';

  // Reset tabs
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector('.ptab').classList.add('active');
  document.getElementById('t-info').classList.add('active');

  renderProfileInfo(p);
  renderProfilePerf(p,perf);
  renderProfileAtt(p,att);
  renderProfileFines(p,att);
}

function closeProfile(){
  nav(previousPage, document.querySelector('.nav-item'));
}

function switchTab(id,el){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderProfileInfo(p){
  document.getElementById('t-info').innerHTML = `
    <div class="two-col">
      <div class="card">
        <div class="card-title">Datos personales</div>
        ${statRow('Nombre completo',p.n)}
        ${statRow('Dorsal',p.d||'—')}
        ${statRow('Posición',POS_NAMES[p.pos])}
        ${statRow('Demarcación',p.dem)}
        ${statRow('Edad',p.age?p.age+' años':'—')}
        ${statRow('Altura',p.h?p.h+' cm':'—')}
        ${statRow('Peso',p.w?p.w+' kg':'—')}
        ${statRow('Alta en club',p.joined||'—')}
      </div>
      <div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-title">Notas</div>
          <div style="font-size:13px;color:${p.notes?'var(--txt)':'var(--faint)'};line-height:1.6;">${p.notes||'Sin notas registradas.'}</div>
        </div>
        <div class="card">
          <div class="card-title">Acciones</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-ghost" style="justify-content:center" onclick="openEditPlayer('${p.id}')">✏️ Editar ficha</button>
            <button class="btn btn-danger" style="justify-content:center" onclick="openDeactivate('${p.id}')">↓ Dar de baja</button>
          </div>
        </div>
      </div>
    </div>`;
}

function renderProfilePerf(p,perf){
  const injuries = (perf.injuries||[]).filter(i=>i.pid===p.id);
  const activeInj = injuries.find(i=>i.active);
  const tests = (perf.tests||[]).filter(t=>t.pid===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const lastTest = tests[0];
  const status = activeInj ? 'injury' : 'fit';

  document.getElementById('t-perf').innerHTML = `
    <div class="two-col">
      <div class="card">
        <div class="card-title">Estado físico</div>
        <div style="margin-bottom:16px;"><span class="pill ${STATUS_CLS[status]}">${STATUS_LBL[status]}</span></div>
        ${activeInj?`
          <div style="background:var(--inj-bg);border:1px solid rgba(220,38,38,.2);border-radius:4px;padding:12px;margin-bottom:12px;">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--inj);margin-bottom:4px;">Lesión activa</div>
            <div style="font-size:12px;color:var(--txt)">${activeInj.zone} · ${activeInj.type}</div>
            <div style="font-size:11px;color:var(--mid);margin-top:3px">Día ${Math.ceil((Date.now()-new Date(activeInj.date))/86400000)} · RTP ~${activeInj.rtp_est}d</div>
          </div>`:''}
        <div class="card-title" style="margin-top:12px;">Historial de lesiones</div>
        ${injuries.length?injuries.slice(0,5).map(i=>`
          <div class="stat-row">
            <div class="stat-lbl">${i.zone} · ${i.type}</div>
            <span class="pill ${i.active?'pill-red':'pill-gray'}">${i.active?'Activa':'Alta'}</span>
          </div>`).join(''):'<div style="font-size:12px;color:var(--faint)">Sin lesiones registradas</div>'}
        <a class="module-link" href="performance.html">
          <span class="module-link-txt">Ver en Performance FC</span>
          <span class="module-link-arr">→</span>
        </a>
      </div>
      <div class="card">
        <div class="card-title">Último test físico</div>
        ${lastTest?`
          <div style="margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint)">${lastTest.date}</div>
          ${lastTest.cmj!=null?statRow('CMJ',lastTest.cmj+' cm'):''}
          ${lastTest.sp10!=null?statRow('Sprint 10m',lastTest.sp10+' s'):''}
          ${lastTest.sp30!=null?statRow('Sprint 30m',lastTest.sp30+' s'):''}
          ${lastTest.asim!=null?statRow('Asimetría',lastTest.asim+'%'):''}
          ${lastTest.hooper!=null?statRow('Hooper Index',lastTest.hooper):''}
          <div style="font-size:11px;color:var(--faint);margin-top:8px">${tests.length} tests totales</div>`
          :'<div style="font-size:12px;color:var(--faint)">Sin tests registrados</div>'}
        <a class="module-link" href="performance.html">
          <span class="module-link-txt">Ver todos los tests</span>
          <span class="module-link-arr">→</span>
        </a>
      </div>
    </div>`;
}

function renderProfileAtt(p,att){
  const sessions = (att.attendance||[]);
  const total = sessions.length;
  const present = sessions.filter(s=>s.results.find(r=>r.playerId===p.id&&r.present)).length;
  const absent = total - present;
  const pct = total ? Math.round(present/total*100) : 0;
  const pctCls = pct>=85?'green':pct>=70?'amber':'red';

  document.getElementById('t-att').innerHTML = `
    <div class="two-col">
      <div class="card">
        <div class="card-title">Resumen de asistencia</div>
        <div class="big-number ${pctCls}">${total?pct+'%':'—'}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--${pctCls==='green'?'fit':pctCls==='amber'?'warn':'inj'})"></div></div>
        <div style="display:flex;gap:20px;margin-top:16px;">
          ${statMini('Sesiones',total)}
          ${statMini('Presente',present)}
          ${statMini('Ausente',absent)}
        </div>
        <a class="module-link" href="asistencia.html">
          <span class="module-link-txt">Ver en Asistencia & Multas</span>
          <span class="module-link-arr">→</span>
        </a>
      </div>
      <div class="card">
        <div class="card-title">Últimas sesiones</div>
        ${total?sessions.slice(-8).reverse().map(s=>{
          const r = s.results.find(r=>r.playerId===p.id);
          const was = r?r.present:null;
          return `<div class="stat-row">
            <div class="stat-lbl" style="font-family:'JetBrains Mono',monospace;font-size:11px">${s.date}</div>
            ${was===null?'<span class="pill pill-gray">Sin dato</span>':was?'<span class="pill pill-green">Presente</span>':'<span class="pill pill-red">Ausente</span>'}
          </div>`;
        }).join(''):'<div style="font-size:12px;color:var(--faint)">Sin sesiones registradas</div>'}
      </div>
    </div>`;
}

function renderProfileFines(p,att){
  const fines = (att.fines||[]).filter(f=>f.playerId===p.id);
  const total = fines.reduce((s,f)=>s+f.amount,0);
  const pending = fines.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0);
  const paid = total-pending;

  document.getElementById('t-fines').innerHTML = `
    <div class="two-col">
      <div class="card">
        <div class="card-title">Resumen económico</div>
        <div class="big-number red">${pending.toFixed(0)}€</div>
        <div style="font-size:12px;color:var(--mid);margin-top:2px">pendiente de pago</div>
        <div style="display:flex;gap:20px;margin-top:14px;">
          ${statMini('Total generado',total.toFixed(0)+'€')}
          ${statMini('Pagado',paid.toFixed(0)+'€')}
          ${statMini('Multas',fines.length)}
        </div>
        <a class="module-link" href="asistencia.html">
          <span class="module-link-txt">Gestionar en Multas</span>
          <span class="module-link-arr">→</span>
        </a>
      </div>
      <div class="card">
        <div class="card-title">Últimas multas</div>
        ${fines.length?[...fines].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6).map(f=>`
          <div class="stat-row">
            <div>
              <div class="stat-lbl">${f.typeName}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)">${f.date}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--r)">${f.amount}€</span>
              <span class="pill ${f.paid?'pill-green':'pill-red'}">${f.paid?'Pagada':'Pendiente'}</span>
            </div>
          </div>`).join('')
          :'<div style="font-size:12px;color:var(--faint)">Sin multas registradas</div>'}
      </div>
    </div>`;
}

/* ── CRUD ── */
function openAddPlayer(){
  document.getElementById('modal-player-title').textContent = 'Nuevo Jugador';
  document.getElementById('np-edit-id').value = '';
  ['np-dorsal','np-nick','np-name','np-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('np-age').value='';
  document.getElementById('np-h').value='';
  document.getElementById('np-w').value='';
  document.getElementById('np-pos').value='POR';
  updateDemOptions();
  openModal('modal-add-player');
}

function openEditPlayer(pid){
  const p = PLAYERS.find(pl=>pl.id===pid);
  if(!p) return;
  document.getElementById('modal-player-title').textContent = 'Editar Jugador';
  document.getElementById('np-edit-id').value = pid;
  document.getElementById('np-dorsal').value = p.d||'';
  document.getElementById('np-nick').value = p.nick;
  document.getElementById('np-name').value = p.n;
  document.getElementById('np-age').value = p.age||'';
  document.getElementById('np-h').value = p.h||'';
  document.getElementById('np-w').value = p.w||'';
  document.getElementById('np-notes').value = p.notes||'';
  document.getElementById('np-pos').value = p.pos;
  updateDemOptions();
  document.getElementById('np-dem').value = p.dem;
  openModal('modal-add-player');
}

function savePlayer(){
  const nick = document.getElementById('np-nick').value.trim();
  const n = document.getElementById('np-name').value.trim();
  if(!nick&&!n){showToast('El nombre es obligatorio','err');return;}
  const editId = document.getElementById('np-edit-id').value;
  const data = {
    d:parseInt(document.getElementById('np-dorsal').value)||0,
    nick:nick||n.split(' ')[0], n:n||nick,
    pos:document.getElementById('np-pos').value,
    dem:document.getElementById('np-dem').value,
    age:parseInt(document.getElementById('np-age').value)||0,
    h:parseInt(document.getElementById('np-h').value)||0,
    w:parseInt(document.getElementById('np-w').value)||0,
    notes:document.getElementById('np-notes').value.trim(),
  };
  if(editId){
    const idx=PLAYERS.findIndex(p=>p.id===editId);
    if(idx>=0) PLAYERS[idx]={...PLAYERS[idx],...data};
    showToast('Ficha actualizada','ok');
  } else {
    PLAYERS.push({id:'p'+Date.now(),active:true,joined:new Date().toISOString().slice(0,10),...data});
    showToast('Jugador añadido','ok');
  }
  savePlayers();
  closeModal('modal-add-player');
  if(editId&&currentProfileId===editId){
    openProfile(editId);
  } else {
    renderSquad(currentFilter);
  }
}

function updateDemOptions(){
  const pos = document.getElementById('np-pos').value;
  const opts = (DEM_BY_POS[pos]||[]).map(d=>`<option value="${d}">${d}</option>`).join('');
  document.getElementById('np-dem').innerHTML = opts;
}

function openDeactivate(pid){
  const p = PLAYERS.find(pl=>pl.id===pid);
  if(!p) return;
  document.getElementById('deact-player-name').textContent = p.d?p.d+' · '+p.nick:p.nick;
  document.getElementById('deact-player-id').value = pid;
  document.getElementById('deact-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('deact-notes').value = '';
  openModal('modal-deactivate');
}

function confirmDeactivate(){
  const pid = document.getElementById('deact-player-id').value;
  const p = PLAYERS.find(pl=>pl.id===pid);
  if(!p) return;
  p.active = false;
  p.deactivated_date = document.getElementById('deact-date').value;
  p.deactivated_reason = document.getElementById('deact-reason').value;
  p.deactivated_notes = document.getElementById('deact-notes').value;
  savePlayers();
  closeModal('modal-deactivate');
  showToast(p.nick+' dado de baja','ok');
  closeProfile();
}

function reactivate(pid){
  const p = PLAYERS.find(pl=>pl.id===pid);
  if(!p) return;
  p.active = true;
  delete p.deactivated_date;
  delete p.deactivated_reason;
  delete p.deactivated_notes;
  savePlayers();
  renderInactive();
  showToast(p.nick+' reactivado','ok');
}

/* ── HELPERS ── */
function shortName(n){const pts=n.split(' ');return pts.length<=2?n:pts[0]+' '+pts[pts.length-1];}
function statRow(lbl,val){return `<div class="stat-row"><span class="stat-lbl">${lbl}</span><span class="stat-val">${val}</span></div>`;}
function statMini(lbl,val){return `<div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--txt)">${val}</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)">${lbl}</div></div>`;}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function overlayClose(e,id){if(e.target.classList.contains('overlay'))closeModal(id);}
let toastTimer=null;
function showToast(msg,type='ok'){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='toast '+(type==='err'?'err':'ok');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3000);
}

/* ── INIT ── */
updateDemOptions();
renderSquad('');
</script>
</body>
</html>
