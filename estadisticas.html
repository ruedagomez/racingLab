<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Estadísticas · Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#e8192c;--r2:rgba(232,25,44,.09);--r3:rgba(232,25,44,.2);
  --blk:#0b0b0b;--txt:#111;--mid:#6b6b6b;--faint:#b0b0b0;
  --bdr:#e2e2e2;--bg:#f3f3f1;--wh:#fff;
  --fit:#15803d;--fit-bg:#f0fdf4;
  --warn:#c2410c;--warn-bg:#fff7ed;
  --inj:#dc2626;--inj-bg:#fef2f2;
  --sidebar:240px;
}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--blk);display:flex;flex-direction:column;position:relative;z-index:10;border-right:3px solid var(--r);}
.sidebar::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-back{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.28);text-transform:uppercase;cursor:pointer;background:none;border:none;padding:0;transition:color .2s;}
.sb-back:hover{color:var(--r);}
.sb-back svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.sb-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--wh);letter-spacing:.5px;line-height:1;}
.sb-name span{color:var(--r);}
.sb-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-top:4px;}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;position:relative;z-index:1;}
.sb-section{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.2);text-transform:uppercase;padding:14px 10px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;cursor:pointer;transition:all .18s;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.4);margin-bottom:1px;border-left:2px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);}
.nav-item.active{background:rgba(232,25,44,.12);color:var(--wh);border-left-color:var(--r);}
.nav-icon{width:18px;text-align:center;font-size:13px;flex-shrink:0;}
.nav-badge{margin-left:auto;font-size:9px;background:var(--r);color:var(--wh);padding:2px 6px;border-radius:10px;font-weight:700;}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:1;}
.sb-foot-txt{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{height:58px;background:var(--wh);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex-shrink:0;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:.1em;color:var(--txt);text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--fit);animation:dot 2s infinite;flex-shrink:0;}
.sync-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mid);}
.sync-row{display:flex;align-items:center;gap:6px;}

/* PAGES */
.page.active{display:block;}

/* UTILS */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:10px;}
.st{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.1em;color:var(--txt);text-transform:uppercase;}
.sc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);}
.card{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:20px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:16px;border-left:3px solid transparent;transition:border-color .2s;}
.kpi:hover{border-left-color:var(--r);}
.kv{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--txt);line-height:1;}
.kv.red{color:var(--r);}.kv.green{color:var(--fit);}.kv.amber{color:var(--warn);}
.kl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-top:3px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;cursor:pointer;border:none;}
.btn-primary{background:var(--r);color:var(--wh);}
.btn-primary:hover{background:#c8151f;box-shadow:0 4px 12px var(--r3);}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mid);}
.btn-ghost:hover{border-color:var(--r);color:var(--r);}
.btn-green{background:var(--fit);color:var(--wh);}
.btn-green:hover{background:#126a34;}
.btn-danger{background:transparent;border:1.5px solid rgba(220,38,38,.25);color:var(--inj);}
.btn-danger:hover{background:var(--inj-bg);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:2px;text-transform:uppercase;}
.pill-green{background:var(--fit-bg);color:var(--fit);}
.pill-red{background:var(--inj-bg);color:var(--inj);}
.pill-amber{background:var(--warn-bg);color:var(--warn);}
.pill-gray{background:#f5f5f5;color:var(--mid);}

/* FILTER TABS */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.ftab{padding:5px 12px;border-radius:3px;border:1.5px solid var(--bdr);background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);cursor:pointer;transition:all .18s;}
.ftab:hover{border-color:var(--r);color:var(--r);}
.ftab.active{background:var(--r);border-color:var(--r);color:var(--wh);}

/* SETUP */
.canvas-area{position:relative;display:inline-block;border:2px dashed var(--bdr);border-radius:6px;overflow:hidden;cursor:crosshair;max-width:100%;}
.canvas-area.has-image{border-color:var(--r);}
#zone-canvas{display:block;max-width:100%;max-height:65vh;}
.upload-placeholder{width:320px;height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;background:var(--bg);}
.upload-placeholder svg{opacity:.2;width:44px;height:44px;}
.upload-placeholder p{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
.zone-layout{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start;}
.zone-sidebar{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:16px;position:sticky;top:10px;}
.zone-sb-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:12px;}
.drawing-info{font-size:12px;color:var(--mid);padding:8px 10px;background:var(--bg);border-radius:4px;margin-bottom:10px;line-height:1.5;}
.zone-list{display:flex;flex-direction:column;gap:5px;max-height:380px;overflow-y:auto;}
.zone-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border-radius:4px;border:1px solid var(--bdr);}
.zone-dot{width:10px;height:10px;border-radius:3px;background:var(--r);flex-shrink:0;}
.zone-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);width:16px;flex-shrink:0;}
.zone-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--txt);flex:1;}
.zone-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;transition:color .18s;}
.zone-del:hover{color:var(--inj);}

/* REGISTER */
.att-upload-area{border:2px dashed var(--bdr);border-radius:6px;padding:48px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--wh);}
.att-upload-area:hover{border-color:var(--r);background:var(--r2);}
.att-two-col{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}
.att-img-preview{border-radius:6px;overflow:hidden;border:1px solid var(--bdr);}
.att-img-preview img{width:100%;height:auto;display:block;}
.att-result-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:4px;margin-bottom:6px;border:1px solid var(--bdr);background:var(--wh);transition:background .2s;}
.att-result-row.present{border-color:rgba(21,128,61,.3);background:var(--fit-bg);}
.att-result-row.absent{border-color:rgba(220,38,38,.2);background:var(--inj-bg);}
.att-pname{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--txt);}
.att-toggle{display:flex;border:1.5px solid var(--bdr);border-radius:4px;overflow:hidden;}
.att-toggle button{padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--mid);border:none;cursor:pointer;transition:all .15s;}
.att-toggle button.on-p{background:var(--fit);color:var(--wh);}
.att-toggle button.on-a{background:var(--inj);color:var(--wh);}


.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:10px;}
.st{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.1em;color:var(--txt);text-transform:uppercase;}
.sc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);}
.card{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:20px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin-bottom:14px;}
.kpi{background:var(--wh);border:1px solid var(--bdr);border-radius:6px;padding:16px;border-left:3px solid transparent;transition:border-color .2s;}
.kpi:hover{border-left-color:var(--r);}
.kv{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--txt);line-height:1;}
.kl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .18s;cursor:pointer;border:none;}
.btn-primary{background:var(--r);color:var(--wh);}
.btn-primary:hover{background:#c8151f;box-shadow:0 4px 12px var(--r3);}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mid);}
.btn-ghost:hover{border-color:var(--r);color:var(--r);}
.btn-green{background:var(--fit);color:var(--wh);}
.btn-green:hover{background:#126a34;}
.btn-sm{padding:4px 10px;font-size:11px;}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:2px;text-transform:uppercase;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{padding:9px 12px;text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border-bottom:1.5px solid var(--bdr);background:var(--wh);}
.tbl td{padding:9px 12px;border-bottom:1px solid rgba(226,226,226,.6);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(232,25,44,.025);}
.tbl .nm{font-weight:600;}
.tbl .nm small{display:block;font-size:11px;font-weight:400;color:var(--faint);}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--wh);border:1px solid var(--bdr);border-radius:8px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.15);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bdr);}
.modal-head h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.modal-close{background:none;border:none;font-size:22px;color:var(--faint);cursor:pointer;padding:0;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;}
.form-control{width:100%;background:var(--bg);border:1.5px solid var(--bdr);border-radius:4px;color:var(--txt);padding:9px 12px;font-size:13px;transition:border-color .18s;}
.form-control:focus{border-color:var(--r);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr);}
.toast{position:fixed;bottom:28px;right:28px;background:var(--blk);color:var(--wh);padding:12px 18px 12px 14px;border-radius:4px;border-left:3px solid var(--r);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease;}
  .dash-grid{grid-template-columns:1fr;}
/* ══════════════════════════════════════════════════════════════════════
   ESTADÍSTICAS · sala de control
   Retícula estricta, hairlines, números grandes en Bebas y cifras
   tabulares en mono. Sin degradados ni sombras blandas: el dato manda.
   ══════════════════════════════════════════════════════════════════════ */

/* ── barra de control ── */
.ctl{position:sticky;top:58px;z-index:40;background:var(--wh);border-bottom:1px solid var(--bdr);
  padding:0 36px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.ctl-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:11px 0;}
.ctl-row+.ctl-row{border-top:1px dashed var(--bdr);}
.ctl-g{display:flex;align-items:center;gap:9px;}
.ctl-lb{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:900;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap;}
.seg{display:flex;border:1px solid var(--bdr);overflow:hidden;background:var(--wh);}
.seg button{padding:5px 12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mid);transition:.14s;background:transparent;
  border-right:1px solid var(--bdr);white-space:nowrap;}
.seg button:last-child{border-right:none;}
.seg button:hover:not(.on){background:var(--bg);color:var(--txt);}
.seg button.on{background:var(--blk);color:var(--wh);}
.seg.red button.on{background:var(--r);}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.chip{padding:4px 9px;border:1px solid var(--bdr);background:var(--wh);font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--mid);transition:.14s;white-space:nowrap;}
.chip:hover{border-color:var(--r);color:var(--r);}
.chip.on{background:var(--r2);border-color:var(--r);color:var(--r);font-weight:500;}
.chip.off{opacity:.42;text-decoration:line-through;}
.ctl-note{font-size:11px;color:var(--faint);font-style:italic;}

/* ── cabecera de sección ── */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:2px solid var(--blk);margin-bottom:20px;}
.hd-t{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:.95;letter-spacing:.5px;}
.hd-t em{font-style:normal;color:var(--r);}
.hd-s{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);padding-bottom:3px;}

/* ── ficha de dato ── */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;
  background:var(--bdr);border:1px solid var(--bdr);margin-bottom:24px;}
.d{background:var(--wh);padding:13px 14px 12px;position:relative;animation:fadeUp .3s both;}
.d-l{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;font-weight:900;letter-spacing:.15em;
  text-transform:uppercase;color:var(--mid);line-height:1.2;min-height:23px;}
.d-v{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:.9;letter-spacing:.5px;margin:5px 0 3px;
  font-variant-numeric:tabular-nums;}
.d-v small{font-size:15px;color:var(--faint);letter-spacing:0;}
.d-v.red{color:var(--r);} .d-v.green{color:var(--fit);} .d-v.dim{color:var(--faint);}
.d-x{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);display:flex;
  align-items:center;gap:5px;min-height:14px;}
.d-x b{font-weight:500;}
.d-d{font-weight:500;} .d-d.up{color:var(--fit);} .d-d.dn{color:var(--inj);}
.d-spark{position:absolute;right:10px;top:11px;opacity:.5;}
.d.acc{box-shadow:inset 3px 0 0 var(--r);}

/* ── comparativa enfrentada ── */
.cmp{border:1px solid var(--bdr);background:var(--wh);margin-bottom:24px;}
.cmp-h{display:grid;grid-template-columns:1fr 148px 1fr;background:var(--blk);color:var(--wh);
  padding:9px 16px;align-items:center;}
.cmp-h span{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;}
.cmp-h span:first-child{color:var(--r);} .cmp-h span:nth-child(2){text-align:center;color:rgba(255,255,255,.35);font-size:9px;}
.cmp-h span:last-child{text-align:right;color:rgba(255,255,255,.75);}
.cmp-r{display:grid;grid-template-columns:46px 1fr 148px 1fr 46px;align-items:center;gap:8px;padding:6px 16px;}
.cmp-r+.cmp-r{border-top:1px solid var(--bg);}
.cmp-r:hover{background:var(--bg);}
.cmp-n{font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;}
.cmp-n.l{text-align:right;} .cmp-n.r{text-align:left;color:var(--mid);}
.cmp-n.win{font-weight:500;color:var(--txt);}
.cmp-l{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mid);}
.bar{height:7px;background:var(--bg);display:flex;}
.bar.l{justify-content:flex-end;}
.bar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.3,1);}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, deleteDoc, addDoc,
         onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";

const app = initializeApp({
  apiKey: "AIzaSyBNDylPVfge6SFXVfJAcna9v7qh_CffI7Y",
  authDomain: "racing-portuense-scouting.firebaseapp.com",
  projectId: "racing-portuense-scouting",
  storageBucket: "racing-portuense-scouting.firebasestorage.app",
  messagingSenderId: "1073919975511",
  appId: "1:1073919975511:web:7c7f59495d1f67f6f44312"
});
const db = getFirestore(app);
const TEMPORADA = '2026-27';

/* ══════════ MÉTRICAS DEL INFORME OVERVIEW DE HUDL ══════════ */
const KEY_METRICS = [
  ['goals','Goals'],['assists','Assists'],['shots','Shots'],
  ['onTarget','On Target'],['offTarget','Off Target'],['saved','Saved'],['blocked','Blocked'],
  ['crosses','Crosses'],['crossesOk','Successful Crosses'],['crossesKo','Unsuccessful Crosses'],
  ['passes','Passes'],['passesOk','Successful Passes'],['passesKo','Unsuccessful Passes'],
  ['receptions','Receptions'],['passReceptions','Pass Receptions'],['crossReceptions','Cross Receptions'],
  ['interceptions','Interceptions'],['passInterceptions','Pass Interceptions'],['crossInterceptions','Cross Interceptions'],
  ['blocks','Blocks'],['passBlocks','Pass Blocks'],['crossBlocks','Cross Blocks'],['shotBlocks','Shot Blocks'],
  ['saves','Saves'],['gkKicks','GK Kicks'],['gkThrows','GK Throws'],
  ['offsides','Offsides'],['fouls','Fouls'],['yellow','Yellow Cards'],['red','Red Cards'],
];
const METRIC_ES = {
  goals:'Goles', assists:'Asistencias', shots:'Tiros', onTarget:'A puerta', offTarget:'Fuera',
  saved:'Parados', blocked:'Bloqueados', crosses:'Centros', crossesOk:'Centros buenos',
  crossesKo:'Centros fallados', passes:'Pases', passesOk:'Pases buenos', passesKo:'Pases fallados',
  receptions:'Recepciones', passReceptions:'Recep. de pase', crossReceptions:'Recep. de centro',
  interceptions:'Intercepciones', passInterceptions:'Intercep. de pase', crossInterceptions:'Intercep. de centro',
  blocks:'Bloqueos', passBlocks:'Bloqueos a pase', crossBlocks:'Bloqueos a centro', shotBlocks:'Bloqueos a tiro',
  saves:'Paradas', gkKicks:'Saques de portero', gkThrows:'Saques de mano',
  offsides:'Fueras de juego', fouls:'Faltas', yellow:'Amarillas', red:'Rojas',
  passesPerAttack:'Pases por ataque',
};

/* ══════════ PARSER DEL PDF ══════════ */
const norm = s => String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* El flujo interno del PDF entrelaza las cuatro columnas del informe, así
   que las líneas se reconstruyen agrupando por coordenada vertical. */
function itemsALineas(items, tolY = 3){
  const filas = [];
  for(const it of items){
    const txt = (it.str||'').trim();
    if(!txt) continue;
    const x = it.transform[4], y = it.transform[5];
    let fila = filas.find(f => Math.abs(f.y - y) <= tolY);
    if(!fila){ fila = {y, cells:[]}; filas.push(fila); }
    fila.cells.push({x, txt});
  }
  filas.sort((a,b)=> b.y - a.y);
  return filas.map(f => { f.cells.sort((a,b)=> a.x - b.x); return f.cells.map(c=>c.txt).join('  '); });
}
/* Rechaza "1%": un porcentaje suelto pertenece a otra columna del informe
   (Attacking Outcomes repite Offsides, Shots o GK Throws). */
function valorTras(resto){
  const r = norm(resto);
  const m = r.match(/^(-|\d+(?:[.,]\d+)?)(?:\s*\((\d+)%\))?(?=$|\s|\D)/);
  if(!m) return null;
  if(/^%/.test(r.slice(m[0].length))) return null;
  if(m[1]==='-') return 0;
  return parseFloat(m[1].replace(',','.'));
}
function buscarMetrica(lineas, label){
  for(const raw of lineas){
    const l = norm(raw);
    let i = l.indexOf(label);
    while(i >= 0){
      const resto = l.slice(i + label.length);
      if((i===0 || /\s/.test(l[i-1])) && (!resto || /^[\s\d(-]/.test(resto))){
        const v = valorTras(resto);
        if(v !== null) return v;
      }
      i = l.indexOf(label, i+1);
    }
  }
  return null;
}
function terciosParse(lineas){
  const res = {ending:null, from:null};
  lineas.forEach((raw, i) => {
    const l = norm(raw);
    if(!/Def Third/.test(l) || !/Mid Third/.test(l)) return;
    let pcts = null;
    for(let j=i-1; j>=Math.max(0,i-3) && !pcts; j--){
      const m = [...norm(lineas[j]).matchAll(/(\d+(?:\.\d+)?)%/g)].map(x=>parseFloat(x[1]));
      if(m.length === 3) pcts = m;
    }
    if(!pcts) return;
    let titulo = null;
    for(let j=i; j>=Math.max(0,i-8) && !titulo; j--){
      const t = norm(lineas[j]);
      if(/Attacks Starting From/.test(t)) titulo='from';
      else if(/Attacks Ending In/.test(t)) titulo='ending';
    }
    if(titulo && !res[titulo]) res[titulo] = {def:pcts[0], mid:pcts[1], atk:pcts[2]};
  });
  return res;
}
function parseBloque(lineas){
  const out = {};
  for(const [key,label] of KEY_METRICS) out[key] = buscarMetrica(lineas, label);
  const t = terciosParse(lineas);
  out.attacksEnding = t.ending;
  out.attacksFrom   = t.from;
  const avg = lineas.map(norm).find(l => /\d+(?:\.\d+)?\s*AVG/.test(l));
  out.passesPerAttack = avg ? parseFloat(avg.match(/(\d+(?:\.\d+)?)\s*AVG/)[1]) : null;
  return out;
}
function parseHudl(lineas){
  if(typeof lineas === 'string') lineas = lineas.split('\n');
  const corte = lineas.findIndex(l => /RCP'?s\s+Opponents/i.test(norm(l)));
  if(corte < 0) return {error:'No encuentro el bloque "RCP\'s Opponents". Exporta la vista Overview completa, con las dos tarjetas desplegadas.'};
  const rcp = parseBloque(lineas.slice(0, corte));
  const opp = parseBloque(lineas.slice(corte));
  const faltan = [];
  for(const [k] of KEY_METRICS){
    if(rcp[k]===null) faltan.push('Racing · '+(METRIC_ES[k]||k));
    if(opp[k]===null) faltan.push('Rival · '+(METRIC_ES[k]||k));
  }
  return {rcp, opp, faltan};
}

/* ══════════ ESTADO ══════════ */
let MATCHES=[], PLAYERS=[], PSTATUS={}, INJURIES=[], ATT=[], FINES=[],
    ALINEACIONES=[], GOLES=[], CONVOCS=[];
let currentMatch = null, parsed = null;
const guardado = (()=>{ try{ return JSON.parse(localStorage.getItem('rl_est_f')||'{}'); }catch(e){ return {}; } })();
const F = {
  comp:   guardado.comp   || 'todo',
  ambito: guardado.ambito || 'ambos',
  agreg:  guardado.agreg  || 'media',
  perfil: guardado.perfil || 'analista',
  sel: new Set(),
};

function showToast(msg, tipo){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(tipo||'');
  clearTimeout(t._h); t._h=setTimeout(()=>{t.className='toast';},2800);
}
window.openModal  = id => document.getElementById(id).classList.add('open');
window.closeModal = id => document.getElementById(id).classList.remove('open');
window.overlayClose = (e,id) => { if(e.target.classList.contains('overlay')) closeModal(id); };

/* ══════════ CARGA ══════════ */
function listen(){
  const on = (col, set) => onSnapshot(collection(db,col),
    s => { set(s.docs.map(d=>({id:d.id,...d.data()}))); renderCtl(); repaint(); },
    e => console.error('['+col+']', e));
  on('matchStats',   v=>{ MATCHES = v.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')); });
  on('players',      v=>{ PLAYERS = v.filter(p=>p.active!==false).sort((a,b)=>(a.d||99)-(b.d||99)); });
  on('injuries',     v=>{ INJURIES = v; });
  on('attendance',   v=>{ ATT = v; });
  on('fines',        v=>{ FINES = v; });
  on('alineaciones', v=>{ ALINEACIONES = v; });
  on('goles',        v=>{ GOLES = v; });
  on('convocatorias',v=>{ CONVOCS = v.filter(c=>c.temporada===TEMPORADA); });
  onSnapshot(collection(db,'playerStatus'), s=>{
    const m={}; s.docs.forEach(d=>{ m[d.id]=d.data().status; });
    PSTATUS=m; repaint();
  }, e=>console.error('[playerStatus]', e));
}

/* ══════════ NAVEGACIÓN ══════════ */
const PAGE_TITLES = {'p-panel':'Panel','p-matches':'Partidos','p-insights':'Lecturas',
  'p-players':'Jugadores','p-import':'Importar Hudl'};
window.nav = function(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

/* ══════════ JUGADORES ══════════ */
const STATUS_ASISTE = ['presente','retraso'];
function asistio(r){
  if(!r) return false;
  return r.status ? STATUS_ASISTE.includes(r.status) : !!r.present;
}
const EST_LABEL = {fit:'Disponible', caution:'Precaución', injury:'Lesionado'};
const EST_PILL  = {fit:'pill-green', caution:'pill-amber', injury:'pill-red'};
function estadoDe(pid){
  if(PSTATUS[pid]) return PSTATUS[pid];
  return INJURIES.some(i=>i.pid===pid && i.active) ? 'injury' : 'fit';
}
/* Los nombres de las actas de la RFAF no coinciden literalmente con los de
   la plantilla: se comparan sin tildes ni puntuación y se exigen al menos
   dos palabras largas en común. Lo dudoso no se asigna. */
function nk(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
}
function casaConJugador(nombreActa, p){
  const a = nk(nombreActa), b = nk(p.n||p.nick);
  return a.filter(w=>b.includes(w)).length >= 2;
}

/* ══════════════════════════════════════════════════════════════════════
   MOTOR ANALÍTICO
   Cuatro ejes de consulta independientes, combinables entre sí:
     · competición  todo | pretemporada | liga
     · partidos     selección libre (chips)
     · ámbito       racing | ambos | diferencial
     · agregación   acumulado | media | partido a partido
   Todo lo que se pinta sale de aquí, así que un cambio de filtro nunca
   deja una pantalla mostrando datos de otra selección.
   ══════════════════════════════════════════════════════════════════════ */

/* Métricas derivadas: se calculan, no se guardan. Si les falta cualquier
   ingrediente devuelven null y la interfaz muestra un guion — nunca un 0
   que se confundiría con un dato real. */
const DERIVED = {
  precPase:    {t:'Precisión de pase',   suf:'%', calc:d => rt(d.passesOk, d.passes, 100)},
  precTiro:    {t:'Tiros a puerta',      suf:'%', calc:d => rt(d.onTarget, d.shots, 100)},
  conversion:  {t:'Conversión de tiro',  suf:'%', calc:d => rt(d.goals, d.shots, 100)},
  eficPuerta:  {t:'Gol por tiro a puerta',suf:'%',calc:d => rt(d.goals, d.onTarget, 100)},
  tirosPorGol: {t:'Tiros por gol',       suf:'',  calc:d => d.goals ? rt(d.shots, d.goals, 1) : null, dec:1},
  precCentro:  {t:'Precisión de centro', suf:'%', calc:d => rt(d.crossesOk, d.crosses, 100)},
  bloqueoTiro: {t:'Tiros bloqueados',    suf:'%', calc:d => rt(d.blocked, d.shots, 100)},
  recuperos:   {t:'Recuperaciones',      suf:'',  calc:d => sum(d.interceptions, d.blocks)},
  atkFinal:    {t:'Ataques al último tercio',suf:'%',calc:d => d.attacksEnding ? d.attacksEnding.atk : null},
  atkPropio:   {t:'Ataques nacidos atrás',suf:'%', calc:d => d.attacksFrom ? d.attacksFrom.def : null},
  paradasPct:  {t:'Paradas / tiros a puerta recibidos', suf:'%', calc:null},
};
const rt = (a,b,f) => (typeof a==='number' && typeof b==='number' && b>0) ? a/b*f : null;
const sum = (...xs) => xs.every(x=>typeof x==='number') ? xs.reduce((a,b)=>a+b,0) : null;

/* Métricas base que se muestran y en qué orden */
const SHOW_BASE = ['goals','shots','onTarget','offTarget','blocked','crosses','crossesOk','passes','passesOk',
  'receptions','interceptions','blocks','shotBlocks','saves','fouls','offsides','yellow','red','passesPerAttack'];
/* Dirección "buena" de cada métrica: 1 = más es mejor, -1 = menos es mejor, 0 = neutra.
   Sirve para colorear deltas sin que el sistema diga que encajar más tiros es una mejora. */
const DIR = {goals:1,shots:1,onTarget:1,offTarget:0,blocked:0,crosses:0,crossesOk:1,passes:1,passesOk:1,
  receptions:0,interceptions:1,blocks:1,shotBlocks:1,saves:0,fouls:-1,offsides:-1,yellow:-1,red:-1,
  passesPerAttack:0,precPase:1,precTiro:1,conversion:1,eficPuerta:1,tirosPorGol:-1,precCentro:1,
  bloqueoTiro:-1,recuperos:1,atkFinal:1,atkPropio:0};

function valorDe(d, k){
  if(!d) return null;
  if(DERIVED[k]) return DERIVED[k].calc ? DERIVED[k].calc(d) : null;
  return typeof d[k]==='number' ? d[k] : null;
}
function etiquetaDe(k){ return DERIVED[k] ? DERIVED[k].t : (METRIC_ES[k]||k); }
function sufijoDe(k){ return DERIVED[k] ? (DERIVED[k].suf||'') : ''; }

/* Agrega una lista de partidos por un lado (rcp|opp).
   'acumulado' suma; 'media' promedia solo los partidos que tienen el dato.
   Las métricas derivadas se recalculan sobre el agregado, no se promedian:
   la media de porcentajes por partido no es el porcentaje del conjunto. */
function agregar(ms, lado, modo){
  const base = {};
  for(const [k] of KEY_METRICS){
    const vals = ms.map(m=>(m[lado]||{})[k]).filter(v=>typeof v==='number');
    base[k] = vals.length ? (modo==='media' ? vals.reduce((a,b)=>a+b,0)/vals.length
                                            : vals.reduce((a,b)=>a+b,0)) : null;
  }
  const ppa = ms.map(m=>(m[lado]||{}).passesPerAttack).filter(v=>typeof v==='number');
  base.passesPerAttack = ppa.length ? ppa.reduce((a,b)=>a+b,0)/ppa.length : null;
  for(const campo of ['attacksEnding','attacksFrom']){
    const vs = ms.map(m=>(m[lado]||{})[campo]).filter(Boolean);
    base[campo] = vs.length ? {
      def: vs.reduce((a,v)=>a+(v.def||0),0)/vs.length,
      mid: vs.reduce((a,v)=>a+(v.mid||0),0)/vs.length,
      atk: vs.reduce((a,v)=>a+(v.atk||0),0)/vs.length } : null;
  }
  /* Los porcentajes se derivan del total agregado en ambos modos: así
     "precisión de pase" de cinco partidos es la real del conjunto. */
  const totales = {};
  for(const [k] of KEY_METRICS){
    const vals = ms.map(m=>(m[lado]||{})[k]).filter(v=>typeof v==='number');
    totales[k] = vals.length ? vals.reduce((a,b)=>a+b,0) : null;
  }
  base._tot = totales;
  return base;
}
function valorAgregado(agg, k){
  if(DERIVED[k] && DERIVED[k].calc) return DERIVED[k].calc(agg._tot ? {...agg._tot,
      attacksEnding:agg.attacksEnding, attacksFrom:agg.attacksFrom} : agg);
  return valorDe(agg, k);
}

/* ══════════════════════════════════════════════════════════════════════
   LECTURAS AUTOMÁTICAS
   Cada lectura enuncia un hecho con el dato que lo sostiene. Nunca se
   emite una lectura si falta el dato, y las que comparan con la media
   necesitan al menos tres partidos: con dos, cualquier "tendencia" es
   ruido y decirlo sería engañoso.
   ══════════════════════════════════════════════════════════════════════ */
function pct(v, dec){ return v===null ? '—' : fmt(v,dec===undefined?0:dec)+'%'; }
function fmt(v, dec){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const d = dec===undefined ? 0 : dec;
  return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toString().replace('.',',');
}

function lecturas(ms, perfil){
  if(!ms.length) return [];
  const A = agregar(ms,'rcp','media'), B = agregar(ms,'opp','media');
  const At = A._tot, Bt = B._tot;
  const out = [];
  const add = (tono,titulo,cuerpo,tag)=>out.push({tono,titulo,cuerpo,tag});
  const n = ms.length;

  if(perfil==='analista'){
    // Eficiencia ofensiva
    const conv = rt(At.goals, At.shots, 100), convR = rt(Bt.goals, Bt.shots, 100);
    const tpg  = At.goals ? At.shots/At.goals : null;
    if(conv!==null){
      const tono = convR!==null ? (conv>=convR?'pos':'neg') : 'neu';
      add(tono, `Convertimos el ${pct(conv,1)} de los tiros`,
        `${At.goals} goles en ${At.shots} tiros` + (tpg? `, uno cada ${fmt(tpg,1)} intentos`:'') +
        (convR!==null? `. Los rivales convierten el ${pct(convR,1)}.`:'.'), 'Finalización');
    }
    const prec = rt(At.onTarget, At.shots, 100);
    if(prec!==null){
      add(prec>=40?'pos':prec>=30?'neu':'neg', `${pct(prec)} de los tiros van a puerta`,
        `${At.onTarget} de ${At.shots}. Es la puerta de entrada de todo lo demás: sin volumen a portería la conversión no se sostiene.`,
        'Finalización');
    }
    // Volumen concedido
    if(typeof Bt.shots==='number'){
      const dif = At.shots - Bt.shots;
      add(dif>=0?'pos':'neg', dif>=0 ? `Generamos ${dif} tiros más que los rivales` : `Concedemos ${Math.abs(dif)} tiros más de los que generamos`,
        `${fmt(A.shots,1)} tiros por partido frente a ${fmt(B.shots,1)} del rival.` +
        (Bt.onTarget!==null? ` De los suyos, ${Bt.onTarget} van a puerta.`:''), 'Balance');
    }
    // Estructura del ataque
    if(A.passesPerAttack!==null){
      const largo = A.passesPerAttack>=4.5, corto = A.passesPerAttack<3;
      const desc = largo ? 'Ataques largos: se elabora antes de finalizar.'
                 : corto ? 'Ataques cortos: mucha finalización tras pocas acciones, perfil directo o de transición.'
                 : 'Duración de ataque intermedia.';
      add('neu', `${fmt(A.passesPerAttack,1)} pases por ataque`,
        desc + (B.passesPerAttack!==null ? ` El rival promedia ${fmt(B.passesPerAttack,1)}.` : ''), 'Estructura');
    }
    if(A.attacksEnding){
      add(A.attacksEnding.atk>=40?'pos':'neu', `${pct(A.attacksEnding.atk)} de nuestros ataques mueren en el último tercio`,
        `Reparto: ${pct(A.attacksEnding.def)} defensivo · ${pct(A.attacksEnding.mid)} medio · ${pct(A.attacksEnding.atk)} ataque.` +
        (B.attacksEnding? ` El rival llega al último tercio en el ${pct(B.attacksEnding.atk)} de los suyos.`:''), 'Progresión');
    }
    const pc2 = rt(At.crossesOk, At.crosses, 100);
    if(pc2!==null && At.crosses>=6){
      add(pc2>=30?'pos':'neg', `Solo ${pct(pc2)} de los centros encuentran destino`,
        `${At.crossesOk} de ${At.crosses}. Con ${fmt(A.crosses,1)} centros por partido, es un canal caro si no mejora.`, 'Finalización');
    }
  }

  if(perfil==='entrenador'){
    const prec = rt(At.passesOk, At.passes, 100), precR = rt(Bt.passesOk, Bt.passes, 100);
    if(prec!==null) add(prec>=85?'pos':prec>=78?'neu':'neg', `Precisión de pase del ${pct(prec)}`,
      `${At.passesOk} de ${At.passes} pases completados` + (precR!==null?`, frente al ${pct(precR)} del rival`:'') + '.', 'Construcción');
    if(A.attacksFrom) add('neu', `${pct(A.attacksFrom.def)} de nuestros ataques nacen en campo propio`,
      `Salida ${pct(A.attacksFrom.def)} · zona media ${pct(A.attacksFrom.mid)} · campo rival ${pct(A.attacksFrom.atk)}. ` +
      (A.attacksFrom.atk>=25? 'Buen porcentaje de robos arriba.' : 'Poca recuperación en campo contrario: el ataque casi siempre arranca lejos.'), 'Salida');
    const rec = sum(At.interceptions, At.blocks);
    if(rec!==null) add('neu', `${rec} recuperaciones (${fmt(rec/n,1)} por partido)`,
      `${At.interceptions} intercepciones y ${At.blocks} bloqueos.` +
      (Bt.passes? ` El rival intenta ${fmt(Bt.passes/n,0)} pases por partido.`:''), 'Presión');
    if(typeof Bt.onTarget==='number' && typeof At.saves==='number'){
      add(Bt.onTarget>At.saves*1.3?'neg':'pos', `Nos rematan ${Bt.onTarget} veces a puerta y paramos ${At.saves}`,
        `Diferencia de ${Bt.onTarget-At.saves}: los que no para el portero acaban dentro o los saca la madera.`, 'Portería');
    }
    if(typeof At.fouls==='number' && typeof Bt.fouls==='number'){
      const d = At.fouls-Bt.fouls;
      add(d>0?'neg':'pos', d>0 ? `Cometemos ${d} faltas más que el rival` : `Cometemos ${Math.abs(d)} faltas menos que el rival`,
        `${fmt(A.fouls,1)} por partido frente a ${fmt(B.fouls,1)}. ` +
        (d>0? 'Cada falta cerca del área es un balón parado en contra.' : 'Buen control del contacto.'), 'Disciplina');
    }
    if(typeof At.offsides==='number' && At.offsides>0){
      add(At.offsides/n>=2?'neg':'neu', `${At.offsides} fueras de juego (${fmt(At.offsides/n,1)} por partido)`,
        'Ataques anulados antes de rematar: revisar timing de desmarque y del último pase.', 'Ataque');
    }
  }

  if(perfil==='fisico'){
    const activos = PLAYERS.length;
    const lesion = PLAYERS.filter(p=>estadoDe(p.id)==='injury').length;
    const prec2  = PLAYERS.filter(p=>estadoDe(p.id)==='caution').length;
    add(lesion? 'neg':'pos', `${activos-lesion-prec2} de ${activos} jugadores plenamente disponibles`,
      `${lesion} lesionados y ${prec2} en precaución. ` +
      (lesion+prec2 >= activos*0.25 ? 'Más de un cuarto de la plantilla condicionada.' : 'Plantel en buen estado.'), 'Disponibilidad');
    const ses = ATT.length;
    if(ses){
      const media = PLAYERS.length ? PLAYERS.reduce((s,p)=>
        s + ATT.filter(x=>asistio((x.results||[]).find(r=>r.playerId===p.id))).length, 0) / (PLAYERS.length*ses) * 100 : null;
      add(media>=90?'pos':media>=80?'neu':'neg', `Asistencia media del ${pct(media)}`,
        `Sobre ${ses} sesiones registradas. Los retrasos cuentan como asistencia.`, 'Asistencia');
      const flojos = PLAYERS.map(p=>({p, v: ATT.filter(x=>asistio((x.results||[]).find(r=>r.playerId===p.id))).length}))
        .filter(x=>x.v/ses < 0.75).sort((a,b)=>a.v-b.v);
      if(flojos.length) add('neg', `${flojos.length} jugador${flojos.length>1?'es':''} por debajo del 75% de asistencia`,
        flojos.slice(0,5).map(x=>`${x.p.nick} (${Math.round(x.v/ses*100)}%)`).join(' · '), 'Asistencia');
    }
    const pend = FINES.filter(f=>!f.paid).reduce((s,f)=>s+(f.amount||0),0);
    if(FINES.length) add(pend>0?'neu':'pos', `${pend}€ pendientes de cobro`,
      `${FINES.filter(f=>!f.paid).length} multas sin pagar de ${FINES.length} registradas.`, 'Disciplina');
    if(n) add('neu', `${n} partido${n>1?'s':''} en la selección actual`,
      'La carga de competición se cruzará con minutos jugados cuando el scraper de actas los extraiga.', 'Carga');
  }

  // Aviso de tamaño de muestra: se pone al final para no encabezar la lista
  if(n>0 && n<3 && perfil!=='fisico'){
    out.push({tono:'neu', titulo:`Lecturas sobre ${n} partido${n>1?'s':''}`,
      cuerpo:'Con esta muestra los números describen lo que pasó, no una tendencia. A partir del tercer partido las comparaciones empiezan a tener peso.',
      tag:'Muestra'});
  }
  return out;
}

const AMBITOS = [['racing','Solo Racing'],['ambos','Racing vs rival'],['dif','Diferencial']];
const AGREGS  = [['acum','Acumulado'],['media','Media/partido'],['partido','Partido a partido']];
const COMPS   = [['todo','Todo'],['pretemporada','Pretemporada'],['liga','Liga']];
const PERFILES= [['analista','Analista'],['entrenador','Entrenador'],['fisico','Preparador físico']];

/* Partidos que pasan los filtros de competición y selección manual */
function partidos(){
  let ms = MATCHES.filter(m => F.comp==='todo' ? true : m.comp===F.comp);
  if(F.sel && F.sel.size) ms = ms.filter(m => F.sel.has(m.id));
  return ms;
}
function partidosComp(){
  return MATCHES.filter(m => F.comp==='todo' ? true : m.comp===F.comp);
}
const resultadoDe = m => m.gf>m.gc ? 'w' : m.gf<m.gc ? 'l' : 'd';
const etiquetaPartido = m => (m.comp==='liga' ? 'J'+(m.jornada||'?') : 'PT') + ' · ' + (m.rival||'');

/* ── barra de control ── */
function renderCtl(){
  const todos = partidosComp();
  const sel = F.sel;
  document.getElementById('ctl').innerHTML = `
    <div class="ctl-row">
      <div class="ctl-g"><span class="ctl-lb">Competición</span>
        <div class="seg">${COMPS.map(([v,t])=>`<button class="${F.comp===v?'on':''}" onclick="setF('comp','${v}')">${t}</button>`).join('')}</div>
      </div>
      <div class="ctl-g"><span class="ctl-lb">Datos</span>
        <div class="seg red">${AMBITOS.map(([v,t])=>`<button class="${F.ambito===v?'on':''}" onclick="setF('ambito','${v}')">${t}</button>`).join('')}</div>
      </div>
      <div class="ctl-g"><span class="ctl-lb">Vista</span>
        <div class="seg">${AGREGS.map(([v,t])=>`<button class="${F.agreg===v?'on':''}" onclick="setF('agreg','${v}')">${t}</button>`).join('')}</div>
      </div>
    </div>
    <div class="ctl-row">
      <div class="ctl-g"><span class="ctl-lb">Partidos</span>
        <div class="chips">
          <button class="chip ${!sel.size?'on':''}" onclick="selTodos()">Todos (${todos.length})</button>
          ${todos.map(m=>`<button class="chip ${sel.size? (sel.has(m.id)?'on':'off') : ''}"
             onclick="toggleSel('${m.id}')" title="${esc(m.rival)} ${m.gf}-${m.gc}">${esc(etiquetaPartido(m))}</button>`).join('')}
        </div>
      </div>
      ${sel.size?`<span class="ctl-note">${sel.size} de ${todos.length} seleccionados</span>`:''}

}
window.setF = function(k,v){
  F[k]=v;
  if(k==='comp') F.sel = new Set();
  guardarF(); renderCtl(); repaint();
};
window.selTodos = function(){ F.sel = new Set(); guardarF(); renderCtl(); repaint(); };
window.toggleSel = function(id){
  const todos = partidosComp().map(m=>m.id);
  if(!F.sel.size) F.sel = new Set(todos);          // primer clic parte de todos
  F.sel.has(id) ? F.sel.delete(id) : F.sel.add(id);
  if(F.sel.size===todos.length || F.sel.size===0) F.sel = new Set();
  guardarF(); renderCtl(); repaint();
};
function guardarF(){
  localStorage.setItem('rl_est_f', JSON.stringify({comp:F.comp, ambito:F.ambito, agreg:F.agreg, perfil:F.perfil}));
}

/* ── ficha de dato ── */
function ficha(k, val, ref, suf, dec, acc){
  let delta = '';
  if(ref!==null && ref!==undefined && val!==null && Math.abs(ref)>0.001){
    const d = val-ref, dir = DIR[k]||0;
    const cls = dir===0 ? '' : (d*dir>0 ? 'up':'dn');
    if(Math.abs(d) >= Math.abs(ref)*0.03)
      delta = `<span class="d-d ${cls}">${d>0?'▲':'▼'} ${fmt(Math.abs(d),dec)}${suf}</span>`;
  }
  return `<div class="d ${acc?'acc':''}">
    <div class="d-l">${etiquetaDe(k)}</div>
    <div class="d-v ${val===null?'dim':''}">${fmt(val,dec)}<small>${val===null?'':suf}</small></div>
    <div class="d-x">${delta || (ref!==null&&ref!==undefined? `<b>media ${fmt(ref,dec)}${suf}</b>`:'&nbsp;')}</div>
  </div>`;
}

/* ── comparativa Racing vs rival ── */
function comparativa(claves, A, B, titulo){
  const fila = k => {
    const a = valorAgregado(A,k), b = valorAgregado(B,k);
    const suf = sufijoDe(k), dec = (DERIVED[k]&&DERIVED[k].dec)||(k==='passesPerAttack'?1:0);
    const max = Math.max(Math.abs(a||0), Math.abs(b||0)) || 1;
    const dir = DIR[k]||0;
    const gana = (a===null||b===null||dir===0) ? '' : ((a-b)*dir>0 ? 'l' : 'r');
    return `<div class="cmp-r">
      <div class="cmp-n l ${gana==='l'?'win':''}">${fmt(a,dec)}${a===null?'':suf}</div>
      <div class="bar l"><i style="width:${Math.abs(a||0)/max*100}%"></i></div>
      <div class="cmp-l">${etiquetaDe(k)}</div>
      <div class="bar r"><i style="width:${Math.abs(b||0)/max*100}%"></i></div>
      <div class="cmp-n r ${gana==='r'?'win':''}">${fmt(b,dec)}${b===null?'':suf}</div>
    </div>`;
  };
  return `<div class="cmp">
    <div class="cmp-h"><span>Racing</span><span>${titulo||''}</span><span>Rival</span></div>
    ${claves.map(fila).join('')}
  </div>`;
}

function tercios(t, etiqueta){
  if(!t) return `<div class="nb">Sin datos de ${etiqueta}.</div>`;
  const tot = (t.def+t.mid+t.atk)||1;
  return `<div class="th3">
      <div style="width:${t.def/tot*100}%;background:#aeb6bf">${fmt(t.def)}%</div>
      <div style="width:${t.mid/tot*100}%;background:#6b7684">${fmt(t.mid)}%</div>
      <div style="width:${t.atk/tot*100}%;background:var(--r)">${fmt(t.atk)}%</div>
    </div><div class="th3-l"><span>Defensivo</span><span>Medio</span><span>Ataque</span></div>`;
}

    <div class="d"><div class="d-l">Diferencia</div><div class="d-v ${gf-gc>0?'green':gf-gc<0?'red':''}">${gf-gc>0?'+':''}${gf-gc}</div>
      <div class="d-x">${ms.map(m=>`<span class="res ${resultadoDe(m)}" title="${esc(m.rival)} ${m.gf}-${m.gc}">${resultadoDe(m)==='w'?'G':resultadoDe(m)==='l'?'P':'E'}</span>`).join('')}</div></div>
  </div>`;

  if(F.agreg==='partido'){ body.innerHTML = cabecera + matriz(ms); return; }

  const modo = F.agreg==='media' ? 'media' : 'acum';
  const A = agregar(ms,'rcp',modo), B = agregar(ms,'opp',modo);

  const dec = k => (DERIVED[k]&&DERIVED[k].dec)||(k==='passesPerAttack'?1:0);

  const claveDest = ['precPase','precTiro','conversion','tirosPorGol','precCentro','atkFinal','recuperos','passesPerAttack'];
  const destacadas = `<div class="dgrid">${claveDest.map(k=>{
    const v = valorAgregado(A,k);
    const r = F.agreg==='media' ? valorAgregado(refA,k) : null;
    return ficha(k, v, r, sufijoDe(k), dec(k));
  }).join('')}</div>`;

  let cuerpo = '';

    cuerpo = `<div class="dgrid">${SHOW_BASE.map(k=>
      ficha(k, valorAgregado(A,k), F.agreg==='media'? valorAgregado(refA,k):null, '', dec(k))).join('')}</div>
      <div class="two-col">
        <div><div class="ph-t">Dónde acaban nuestros ataques</div>${tercios(A.attacksEnding,'ataques')}</div>
        <div><div class="ph-t">Dónde empiezan</div>${tercios(A.attacksFrom,'origen')}</div>
      </div>`;
  } else if(F.ambito==='ambos'){
    cuerpo = comparativa([...SHOW_BASE.filter(k=>k!=='passesPerAttack'),'precPase','precTiro','conversion','passesPerAttack'],
        A, B, F.agreg==='media'?'media por partido':'acumulado') +
      `<div class="two-col">
        <div><div class="ph-t">Ataques del Racing acaban en</div>${tercios(A.attacksEnding,'ataques')}</div>
        <div><div class="ph-t">Ataques del rival acaban en</div>${tercios(B.attacksEnding,'ataques')}</div>

  } else {

        const a=valorAgregado(A,k), b=valorAgregado(B,k);

          <div class="d-v ${d===null?'dim':cls}">${d===null?'—':(d>0?'+':'')+fmt(d,dec(k))}<small>${d===null?'':sufijoDe(k)}</small></div>
          <div class="d-x"><b>${fmt(a,dec(k))} vs ${fmt(b,dec(k))}</b></div></div>`;
      }).join('')}</div>`;
  }
  body.innerHTML = cabecera + destacadas + cuerpo;
}

/* ── matriz partido a partido, con mapa de calor por métrica ── */
function matriz(ms){
  const cols = ['goals','shots','onTarget','passes','precPase','crosses','interceptions','fouls','passesPerAttack'];
  const lado = F.ambito==='ambos' ? null : (F.ambito==='dif' ? 'dif' : 'rcp');
  const val = (m,k) => {
    const a = valorDe(m.rcp,k), b = valorDe(m.opp,k);
    if(lado==='rcp') return a;
    if(lado==='dif') return (a===null||b===null)?null:a-b;
    return a;
  };
  const rangos = {};
  cols.forEach(k=>{
    const vs = ms.map(m=>val(m,k)).filter(v=>v!==null);
    rangos[k] = vs.length ? {min:Math.min(...vs), max:Math.max(...vs)} : null;
  });
  const celda = (m,k) => {
    const v = val(m,k), r = rangos[k];
    const dec = (DERIVED[k]&&DERIVED[k].dec)||(k==='passesPerAttack'?1:0);
    let bg = 'transparent';
    if(v!==null && r && r.max>r.min){
      const t = (v-r.min)/(r.max-r.min);
      const dir = DIR[k]||0;
      const bueno = dir===0 ? t : (dir>0 ? t : 1-t);
      bg = `rgba(${bueno>0.5?'21,128,61':'220,38,38'},${Math.abs(bueno-0.5)*0.30})`;
    }
    const b = F.ambito==='ambos' ? valorDe(m.opp,k) : null;
    return `<td><span class="hm" style="background:${bg}">${fmt(v,dec)}${sufijoDe(k)}</span>${
      b!==null?`<span style="color:var(--faint);font-size:11px"> / ${fmt(b,dec)}${sufijoDe(k)}</span>`:''}</td>`;
  };
  const tot = agregar(ms,'rcp', 'media');
  return `<div class="mx-wrap"><table class="mx">
    <thead><tr><th>Partido</th>${cols.map(k=>`<th>${etiquetaDe(k)}</th>`).join('')}</tr></thead>
    <tbody>${ms.map(m=>`<tr>
      <th><span class="res ${resultadoDe(m)}">${resultadoDe(m)==='w'?'G':resultadoDe(m)==='l'?'P':'E'}</span>${esc(m.rival)}
        <span style="color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:10px"> ${m.gf}-${m.gc} · ${m.condicion==='casa'?'C':'F'}</span></th>
      ${cols.map(k=>celda(m,k)).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><th>Media</th>${cols.map(k=>{
      const dec = (DERIVED[k]&&DERIVED[k].dec)||(k==='passesPerAttack'?1:0);
      return `<td>${fmt(valorAgregado(tot,k),dec)}${sufijoDe(k)}</td>`;}).join('')}</tr></tfoot>
  </table></div>
  ${F.ambito==='ambos'?'<div class="nb">Cada celda muestra <b>Racing / rival</b>. El color compara solo nuestros valores entre partidos.</div>':
    '<div class="nb">El color compara cada columna entre los partidos seleccionados: verde, el mejor registro; rojo, el peor.</div>'}`;
}

   LECTURAS

window.setPerfil = function(p){ F.perfil=p; guardarF(); renderLecturas(); };
function renderLecturas(){

  document.getElementById('lc-head').innerHTML = `<div class="hd">

    <div class="seg red" style="margin-bottom:18px">${PERFILES.map(([v,t])=>

  const body = document.getElementById('lc-body');
  if(!ms.length && F.perfil!=='fisico'){ body.innerHTML = vacio(); return; }

  const items = lecturas(ms, F.perfil);
  let extra = '';
  if(F.perfil==='entrenador' && ms.length){
    const A = agregar(ms,'rcp','media'), B = agregar(ms,'opp','media');
    const m = (k,l,d) => {
      const a = valorAgregado(A,k), b = valorAgregado(B,k);
      const dir = DIR[k]||0;
      const ico = (a===null||b===null||dir===0)?'eq':((a-b)*dir>0?'up':'dn');
      return `<div class="ph-m"><div class="ph-k">${l||etiquetaDe(k)}</div>
        <div class="ph-v">${fmt(a,d||0)}${sufijoDe(k)}<i class="${ico}">${ico==='up'?'▲':ico==='dn'?'▼':'='}</i></div></div>`;
    };
    extra = `<div class="ph">
      <div class="ph-c"><div class="ph-t">Construcción</div>
        ${m('precPase')}${m('passes')}${m('passesPerAttack',null,1)}${m('atkPropio')}</div>
      <div class="ph-c"><div class="ph-t">Progresión</div>
        ${m('atkFinal')}${m('crosses')}${m('precCentro')}${m('receptions')}</div>
      <div class="ph-c"><div class="ph-t">Finalización</div>
        ${m('shots')}${m('precTiro')}${m('conversion')}${m('goals')}</div>
      <div class="ph-c"><div class="ph-t">Fase defensiva</div>
        ${m('interceptions')}${m('blocks')}${m('saves')}${m('fouls')}</div>
    </div>
    <div class="nb">La flecha compara cada métrica con la del rival en los mismos partidos: ▲ estamos por encima en la dirección favorable, ▼ por debajo.</div>`;
  }
  body.innerHTML = extra + items.map((i,ix)=>`
    <div class="ins ${i.tono}" style="animation-delay:${ix*45}ms">
      <span class="ins-tag">${i.tag}</span>
      <div class="ins-t">${i.titulo}</div>
      <div class="ins-b">${i.cuerpo}</div>
    </div>`).join('');
}

/* ══════════════════════════════════════════════════════════════════════
   PARTIDOS
   ══════════════════════════════════════════════════════════════════════ */
function renderPartidos(){
  const ms = partidos().slice().reverse();
  document.getElementById('mt-head').innerHTML = `<div class="hd">
      <div class="hd-t">Partidos<em>.</em></div><div class="hd-s">${ms.length} en la selección</div></div>`;
  const body = document.getElementById('mt-body');
  if(!ms.length){ body.innerHTML = vacio(); return; }
  body.innerHTML = `<div class="mgrid">${ms.map((m,i)=>{
    const prec = rt((m.rcp||{}).passesOk,(m.rcp||{}).passes,100);
    return `<div class="m ${resultadoDe(m)}" style="animation-delay:${i*30}ms" onclick="openMatch('${m.id}')">
      <div class="m-h"><span>${m.comp==='liga'?'JORNADA '+(m.jornada||'?'):'PRETEMPORADA'}</span><span>${m.fecha||''}</span></div>
      <div class="m-s">${m.gf}<span>–</span>${m.gc}</div>
      <div class="m-r">${esc(m.rival)}</div>
      <div class="m-f"><span>${m.condicion==='casa'?'CASA':'FUERA'}</span>
        <span>${(m.rcp||{}).shots??'—'} tiros</span><span>${prec===null?'—':Math.round(prec)+'% pase'}</span></div>
    </div>`;}).join('')}</div>`;
}
window.openMatch = function(id){
  const m = MATCHES.find(x=>x.id===id);
  if(!m) return;
  currentMatch = m;
  document.getElementById('md-title').textContent =
    `${m.condicion==='casa'?'Racing':m.rival} ${m.gf}-${m.gc} ${m.condicion==='casa'?m.rival:'Racing'}`;
  const A={...(m.rcp||{})}, B={...(m.opp||{})};
  A._tot=A; B._tot=B;
  document.getElementById('md-body').innerHTML = `
    <div class="nb">${m.comp==='liga'?'Jornada '+(m.jornada||'?'):'Pretemporada'} · ${m.fecha||'sin fecha'} ·
      ${m.condicion==='casa'?'en casa':'a domicilio'}${m.importadoPor?' · importado por '+esc(m.importadoPor):''}</div>
    ${comparativa(['goals','shots','onTarget','precTiro','conversion','crosses','precCentro','passes','precPase',
      'passesPerAttack','interceptions','blocks','saves','fouls','offsides'], A, B, 'este partido')}
    <div class="two-col">
      <div><div class="ph-t">Ataques del Racing</div>${tercios(A.attacksEnding,'ataques')}</div>
      <div><div class="ph-t">Ataques del rival</div>${tercios(B.attacksEnding,'ataques')}</div>
    </div>
    ${m.notas?`<div class="nb" style="margin-top:14px">${esc(m.notas)}</div>`:''}`;
  openModal('modal-match');
};
window.deleteMatch = async function(){
  if(!currentMatch) return;
  if(!confirm(`¿Eliminar los datos del partido contra ${currentMatch.rival}?`)) return;
  try{ await deleteDoc(doc(db,'matchStats',currentMatch.id)); closeModal('modal-match'); showToast('Partido eliminado'); }
  catch(e){ console.error(e); showToast('No se pudo eliminar','err'); }
};

function vacio(){
  return `<div class="empty">
    <div class="empty-t">Sin partidos en esta selección</div>
    <div class="empty-s">Cambia los filtros de arriba o importa el informe <b>Overview</b> de Hudl para empezar a ver datos.</div>
    <button class="btn btn-primary" style="margin-top:18px" onclick="nav('p-import')">Importar informe</button>
  </div>`;
}


/* ══════════ INIT ══════════ */
renderCtl();
listen();
repaint();

</script>
